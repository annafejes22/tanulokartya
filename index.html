    id: 15,
    cim: "Gyógypedagógia fogalma, tankötelezettség",
    tetelSzoveg: "Ismertesse a gyógypedagógia fogalmát, tárgyát, célját! Mutassa be a gyógypedagógiai tankötelezettség főbb jellemzőit! Értelmezze az alábbi fogalmakat: különleges bánásmód, BTMN, SNI, integráció, inklúzió, szegregáció.",
    teljesLeiras: `A gyógypedagógia az a tudományág és gyakorlati tevékenység, amely az akadályozott fejlődésű, sérült, fogyatékos személyek nevelésével, oktatásával, fejlesztésével és rehabilitációjával foglalkozik. Tárgya az akadályozott fejlődésű, sérült személyek nevelési, oktatási és fejlesztési szükségletei, valamint az ezekre adott speciális pedagógiai válaszok. Célja a fogyatékos személyek optimális fejlesztése, a minőségi élet biztosítása, a társadalmi beilleszkedés elősegítése és az önállóság maximalizálása.

A különleges bánásmódot igénylő gyermekek köre tágabb fogalom: ide tartoznak az SNI-s tanulók, a BTMN-es tanulók és a kiemelkedően tehetséges tanulók is, akik mindannyian egyéni, differenciált ellátást igényelnek. A BTMN, vagyis a Beilleszkedési, Tanulási, Magatartási Nehézség nem fogyatékosság, hanem funkcionális nehézség – például a diszlexia veszélye, a hiperaktivitás vagy a beilleszkedési gondok –, amely pedagógiai szempontból speciális módszereket igényel. Az SNI két kategóriára osztható: az SNI 'A' kategória a súlyosabb fogyatékosságot jelenti, mint a vakság, a süketség, a mozgáskorlátozottság, az értelmi akadályozottság vagy az autizmus, amely többletforrásra jogosít, az SNI 'B' kategória pedig az enyhébb fogyatékosságot foglalja magában.

A gyógypedagógiai tankötelezettség azt jelenti, hogy az SNI-s gyermekeknek is kötelező a tankötelezettség, amelyet speciális intézményben, integrált formában vagy fejlesztő nevelés-oktatás keretében teljesíthetnek. A fejlesztő nevelés-oktatás a legsúlyosabb fogyatékosságú gyermekek számára biztosított iskolai forma, ahol az oktatási cél helyett a fejlesztés és a gondozás kap prioritást. Az állam törvényi jogként biztosítja az SNI-s gyermekek ellátását: ingyenes szakszolgáltatást, fejlesztő pedagógust, gyógypedagógust, segítő munkatársat, segédeszközöket és korai fejlesztést.

Az integráció, az inklúzió és a szegregáció fogalmait szükséges pontosan elhatárolni egymástól. Az integráció esetén az SNI-s tanuló a többségi intézménybe kerül, és ott speciális segítséggel vesz részt az oktatásban, miközben a rendszer csak minimálisan változik körülötte. Az inklúzió a teljes befogadás elvén alapuló szemlélet, ahol az iskola és a tanítás módszertana alakul a tanuló sokszínűségéhez, és mindenki aktív tagja marad a közösségnek. A szegregáció esetén az SNI-s tanulókat speciális intézménybe irányítják, ahol homogén csoportban kapnak szakmai ellátást – súlyos esetekben ez indokolt megoldás lehet.

Az Egységes Gyógypedagógiai Módszertani Intézmény, röviden EGYMI, utazó gyógypedagógusokat biztosít integrált iskolákba, és tanácsadást, fejlesztést is nyújt. A Szakértői Bizottság feladata az SNI meglétének, típusának és fokának megállapítása, javaslattétel az oktatás formájára, valamint a szükséges ellátás meghatározása. Mindezek alapján minden SNI-s gyermek egyéni fejlesztési tervet kap, amely személyre szabottan tartalmazza a fejlesztési célokat, a módszereket, a felelős személyeket és az értékelési szempontokat.

A gyógypedagógia alapelvei közé tartozik a humanitás, a személy méltóságának tisztelete, az optimális fejlesztés elve, a normalizáció, az integráció, a közösségi beágyazottság és az individualizáció. A normalizáció elve azt jelenti, hogy mindenkit, fogyatékosságától függetlenül, megillet a normális életkörülmények és életritmus lehetősége. A komplex rehabilitáció az orvosi, pedagógiai, szociális és foglalkozási rehabilitáció együttese, amely a teljes ember minden területén segíti a beilleszkedést. A gyógypedagógia interdiszciplináris tudomány: szorosan kapcsolódik a pszichológiához, az orvostudományhoz, a szociológiához, a joghoz és az informatikához is. A gyógypedagógiai asszisztens ebben a rendszerben a gyógypedagógus irányítása alatt dolgozik: megvalósítja a fejlesztési tervet, gondozási feladatokat végez, és segíti a mindennapi tevékenységeket.`,

      { k: "Hogyan biztosítja az állam az SNI-s gyermekek ellátását?", v: "Ingyenes szakszolgáltatás, fejlesztő pedagógus, gyógypedagógus, segítő munkatárs, segédeszközök, korai fejlesztés – ezek mind törvényi jogok." },

      { k: "Mi az EGYMI feladata?", v: "Egységes Gyógypedagógiai Módszertani Intézmény – utazó gyógypedagógusokat biztosít integrált iskolákba, tanácsadást és fejlesztést nyújt." },

      { k: "Mi az egyéni fejlesztési terv (EFT)?", v: "Személyre szabott, rendszeresen felülvizsgált terv, amely tartalmazza a fejlesztési célokat, módszereket, a felelős személyeket és az értékelési szempontokat." },

  {
    id: 16,
    cim: "Szakértői bizottság, korai fejlesztés",
    tetelSzoveg: "Mutassa be a szakértői bizottság tevékenységét, a gyógypedagógiai diagnózis felállításának lényeges jellemzőit! Ismertesse a korai fejlesztés és gondozás fogalmát, feladatát, tartalmát!",
    teljesLeiras: `A Szakértői Bizottság a pedagógiai szakszolgálat része, amelynek feladata a fogyatékosság diagnosztizálása, javaslat tétele az ellátásra, valamint a fejlesztési javaslat megfogalmazása. Tagjai a vezető gyógypedagógus, egy pszichológus és egy szakorvos, szükség esetén logopédus, konduktor vagy szociális munkás is részt vesz a munkában. A szakértői vélemény tartalmazza a fogyatékosság megállapítását, annak típusát és fokát, az oktatási forma javaslatát – integrált vagy szegregált –, valamint a szükséges fejlesztéseket és segédeszközöket.

A gyógypedagógiai diagnózis komplex állapotfelmérés, amely nemcsak a fogyatékosságot azonosítja, hanem a gyermek erősségeit, fejlesztési lehetőségeit és szükségleteit is feltárja. A vizsgálat folyamata jól meghatározott lépésekből áll: először felveszik az anamnézist, vagyis a gyermek teljes fejlődéstörténetét – a terhességet, a szülést, a korai fejlődési mérföldköveket, a betegségeket és a családi-szociális hátteret –, ezt követi a pszichológiai vizsgálat, majd a gyógypedagógiai vizsgálat, az orvosi vélemény, a komplex értékelés, a szülőkkel való megbeszélés, és végül elkészül a szakvélemény. A vizsgálat során standardizált teszteket alkalmaznak, mint a Bender, a Raven vagy a WISC, ezenkívül megfigyelést, szülői interjút és dokumentumelemzést, például az óvodai jellemzést is végeznek. A szakértői véleményt rendszeresen, általában két-három évente felül kell vizsgálni, mert a gyermek állapota és szükségletei változhatnak. A szülőknek joguk van jelen lenni a vizsgálaton, bepillanthatnak a véleménybe, fellebbezhetnek, és bizonyos korlátok között dönthetnek az oktatási forma megválasztásáról is.

A korai fejlesztés a nulla-öt éves korú, fogyatékosság kockázatával élő vagy fogyatékos gyermekeknek nyújtott komplex fejlesztési és gondozási szolgáltatás. Azért kritikus, mert az idegrendszer az élet első éveiben a legplasztikusabb, így a korai beavatkozás sokkal hatékonyabb, mint a késői, és a fejlődési zavarok hatása is jobban kompenzálható. A korai fejlesztés tartalma a gyógypedagógiai fejlesztés, a pszichológiai gondozás, a szülők támogatása, a logopédia, a konduktív pedagógia, a gyógytorna, és szükség esetén az orvosi kezelés. Formái lehetnek ambulánsak, amikor a gyermek bejár, otthoniak, amikor a szakember megy ki a családhoz, vagy intézményesek, mint a bölcsőde vagy a korai fejlesztő csoport. Célja a másodlagos fogyatékosságok kialakulásának megelőzése, a fejlődés optimalizálása, a szülők megerősítése, és az óvodai integráció elősegítése.

A korai gondozás a korai fejlesztés részterülete: ide tartozik az egészségügyi gondozás, a higiéniás és ápolási feladatok, valamint a szükséges eszközök biztosítása. A rizikógyermek fogalma olyan gyermeket jelöl, akinél a fogyatékosság kialakulásának fokozott veszélye áll fenn, például koraszülöttség, genetikai ok vagy kedvezőtlen környezet miatt. A szülők aktív részesei a korai fejlesztésnek: megtanulják otthon is végezni a fejlesztő tevékenységeket, ezzel megtöbbszörözve annak hatását. A gyógypedagógiai asszisztens a korai fejlesztésben a gyógypedagógus irányítása alatt vesz részt a gondozásban, a mindennapi tevékenységek előkészítésében és a szülők tájékoztatásának támogatásában.`,

      { k: "Mi a Szakértői Bizottság?", v: "Szakértői Bizottság (korábban SZBI) a pedagógiai szakszolgálat része. Feladata: fogyatékosság diagnosztizálása, javaslat az ellátásra, fejlesztési javaslat." },
      { k: "Kik a szakértői bizottság tagjai?", v: "Gyógypedagógus (vezető), pszichológus és orvos (szakorvos). Szükség szerint logopédus, konduktor, szociális munkás is részt vesz." },
      { k: "Mi a szakértői vélemény tartalma?", v: "A fogyatékosság megállapítása, annak típusa és foka, oktatási forma javaslata (integrált/szegregált), szükséges fejlesztések és segédeszközök." },

      { k: "Mi az anamnézis?", v: "A gyermek teljes fejlődéstörténete: terhesség, szülés, korai fejlődési mérföldkövek, betegségek, familia- és szociális háttér." },
      { k: "Mi a korai fejlesztés fogalma?", v: "0-5 éves korban fogyatékosság kockázatával élő vagy fogyatékos gyermekeknek nyújtott komplex fejlesztési és gondozási szolgáltatás." },
      { k: "Miért kritikus a korai fejlesztés?", v: "Az idegrendszer az élet első éveiben a legplasztikusabb – a korai beavatkozás sokkal hatékonyabb, mint a késői. A fejlődési zavarok hatása jobban kompenzálható." },

      { k: "Mi a korai fejlesztés formái?", v: "Ambuláns (a gyermek jár be), otthoni (szakember megy ki), intézményes (bölcsőde, korai fejlesztő csoport)." },

      { k: "Milyen vizsgálati módszereket alkalmaz a szakértői bizottság?", v: "Standardizált tesztek (Bender, Raven, WISC stb.), megfigyelés, interjú szülővel, dokumentumelemzés (óvodai jellemzés), klinikai megfigyelés." },

      { k: "Milyen jogai vannak a szülőknek a diagnosztikai folyamatban?", v: "Jelen lehetnek a vizsgálaton, bepillanthatnak a véleménybe, fellebbezhetnek, és dönthetnek az oktatási forma megválasztásáról (korlátokkal)." },

      { k: "Mi a gyógypedagógiai asszisztens feladata a korai fejlesztésben?", v: "A gyógypedagógus irányítása alatt részt vesz a gondozásban, a mindennapi tevékenységek előkészítésében, szülők tájékoztatásának támogatásában." },
      { k: "Milyen dokumentumok kísérik az SNI-s gyermeket az ellátás során?", v: "Szakértői vélemény, egyéni fejlesztési terv, haladási napló, óvodai/iskolai jellemzés, orvosi dokumentáció." },

      { f: "Szakértői Bizottság", m: "Egy csapat szakember (gyógypedagógus, pszichológus, orvos), akik megvizsgálják, hogy a gyereknek van-e valamilyen fogyatékossága, és milyen segítségre van szüksége." },
      { f: "Gyógypedagógiai diagnózis", m: "Nem csak a 'mi a baj' megállapítása, hanem annak feltárása is, miben erős a gyerek, és hogyan lehet a legjobban fejleszteni." },

    teljesLeiras: `A tanulásban akadályozottság enyhe fokú intellektuális károsodás, amely az iskolai tanulási teljesítményt számottevően gátolja, de az önálló életvitelt nem zárja ki. Fontos megjegyezni, hogy a tanulásban akadályozottság tágabb fogalom, mint az enyhe értelmi fogyatékosság: nem minden tanulásban akadályozott tanuló értelmileg fogyatékos, a fogalom magában foglalja az enyhe értelmi fogyatékosságot, de más okú tanulási nehézségeket is.

Okai lehetnek organikusak, vagyis agykárosodás vagy genetikai ok, környezetiek, mint a depriváció vagy az elhanyagolás, funkcionálisak, például érzelmi zavar, vagy ezek kombinációja. Főbb tünetei közé tartozik a gyenge érzékelés, a sajátos – rövid, könnyen elterelhető – figyelem, az emlékezeti problémák, a lassú tanulási tempó és az absztrakcióra való korlátozott képesség. A figyelem rövid kapacitású és könnyen elvonható, de a tanuló számára érdekes témában tartósabb koncentrációra is képes lehet. Az emlékezetre lassú bevésés és gyors felejtés jellemző, a mechanikus emlékezet viszonylag jobb, mint az összefüggő emlékezet, ezért az ismétlés és a strukturálás sokat segít.

A nevelési-oktatási elvek között kiemelt szerepe van a fokozott szemléletességnek, a lassabb haladási tempónak, a kisebb lépésekre bontásnak, az azonnali megerősítésnek, a sok ismétlésnek, az erős oldalakon való kompenzálásnak és a praktikus, életközeli tartalmaknak. Az iskoláztatás formái lehetnek az enyhe értelmi fogyatékosok szegregált iskolája, az integrált általános iskola megfelelő támogatással, vagy a legsúlyosabb esetekben a fejlesztő nevelés-oktatás. A tantárgy-pedagógia ezeknél a tanulóknál életközeli, funkcionális tartalmakra, cselekvésbe ágyazott tanulásra épít, kevesebb elvont elméleti anyaggal és több gyakorlati készségfejlesztéssel.

Megfelelő nevelés és fejlesztés esetén az önálló életvitel számos területen elérhető: önellátás, egyszerű munkavégzés, akár önálló – esetleg támogatott – lakhatás, szociális kapcsolatok és közösségi részvétel. A támogatott életvitel azt jelenti, hogy a tanulásban akadályozott felnőtt önállóan él, de időszakos támogatást kap, például ügyintézésben, pénzkezelésben vagy egészségügyi döntésekben. Foglalkoztatási lehetőség lehet a védett, szociális foglalkoztatás, a nyílt munkaerőpiaci foglalkoztatás egyszerűbb munkakörökben, vagy a szociális szövetkezet. Az életviteli kompetenciák – önkiszolgálás, főzés, pénzkezelés, közlekedés, ügyintézés – célzott tanítása elengedhetetlen a mindennapi élethez való alkalmazkodáshoz.

A família szerepe döntő: az elfogadás, a realisztikus elvárások és a fejlesztésbe való bevonás alapvetően meghatározza a tanulásban akadályozott személy fejlődését. A gyógypedagógiai asszisztens egyéni segítségnyújtást ad a feladatmegoldásban, támogatja az önkiszolgálást, segíti a szociális helyzeteket, és biztosítja az érzelmi biztonságot. Fontos a differenciált értékelés is: nem az osztálytársaikhoz, hanem saját korábbi teljesítményükhöz mérten értékeljük őket, ami megőrzi az önbizalmukat és a motivációjukat.`,

    teljesLeiras: `Az értelmi akadályozottság középsúlyos és súlyos mértékű intellektuális károsodás, amely az összes pszichikus funkciót érinti, és az önálló életvitelt nagymértékben korlátozza. A tanulásban akadályozottságtól mértékben és az önállóság fokában különbözik: az értelmileg akadályozott személy nagyobb függőségben él, és több, speciálisabb gondozást igényel.

  {
    id: 19,

    tetelSzoveg: "Ismertesse a látássérülés fogalmát, okait, csoportjait, nevelésük, oktatásuk főbb jellemzőit! Mutassa be a tanulás és a tájékozódás speciális eszközeit! Jellemezze a vak gyermek mozgásfejlődésének és nyelvi fejlődésének sajátosságait!",
    teljesLeiras: `A látássérülés a látóélesség és/vagy a látótér olyan mértékű károsodása, amely az egyén mindennapi tevékenységeit, tanulását és tájékozódását korlátozza. Három fő csoportja van: a gyengénlátók, akiknek látóélessége 0,1 és 0,3 közötti, és segédeszközzel olvasnak; az aliglátók, 0,01 és 0,1 közötti látásélességgel, akik speciális módszereket igényelnek; és a vakok, akiknél a látásélesség 0,01 alatti, vagy egyáltalán nincs fényérzékelés, és náluk a tapintó és halló csatorna dominál. Okai lehetnek veleszületettek, genetikai vagy embrionális fejlődési zavar, vagy szerzettek, baleset vagy betegség, mint a glaukóma, a diabéteszes retinopátia vagy a szürkehályog következtében.

A vakok speciális olvasás-írástanítási eszköze a Braille-írás, amelyet Louis Braille dolgozott ki 1829-ben: ez egy domborpontos írás- és olvasásrendszer, hat pont hatvannégy kombinációjával jelöl betűket, számokat és zenét is. Mellette használatosak a nagy és kis hatrekeszes dobozok, a gombás és szöges táblák, valamint a Braille-írógép is. A tájékozódást segítő eszközök közé tartozik a fehér bot, a tájékozódási képzés, amely mentális térkép kialakítását jelenti, a vakvezető kutya, az auditív jelzők és a GPS-alapú okostelefonos alkalmazások is.

A vak gyermek mozgásfejlődése jellemzően lassabb, mert hiányzik a vizuális motiváció, vagyis a látvány, ami a fordulásra, mászásra, járásra ösztönözné, ezért speciális mozgásos stimuláció szükséges. Megjelenhet náluk az úgynevezett lereagáló mozgás is, vagyis sztereotip, repetitív mozgás, például ringatózás, ami a szenzoros inputtól való megfosztottság kompenzálása. Nyelvi fejlődésük gyakran jó verbális képességekkel jár, mert a hallás és a kommunikáció kompenzálja a látáshiányt, de megjelenhet a verbalizmus jelensége: a vak gyermek sok olyan szót és fogalmat tanul meg, amelyhez nincs valódi tapasztalata – például tudja, mi az, hogy 'kék', de soha nem látta.

A vakok oktatásában a fejlesztésnek figyelembe kell vennie a látássérülés fokát: gyengénlátóknál kontrasztos, nagyított nyomtatás és jó megvilágítás, aliglátóknál auditív anyagok és tapintás, vakoknál teljesen tapintásos és auditív csatornák szükségesek. Megfelelő adaptációkkal – akadálymentesítéssel, segédeszközökkel, kísérő pedagógussal – az óvodai és iskolai integráció is megvalósítható, a Vakok Általános Iskolája pedig speciálisan képzett szakembereivel az optimális fejlesztést biztosítja. A modern technika is sok segítséget nyújt: képernyőolvasó szoftverek, mint a JAWS vagy az NVDA, Braille-kijelző, hangoskönyvek, hangvezérlésű okostelefon és nagyítók.

A látás elvesztésének, vagyis a szerzett vakságnak komoly pszichés hatása van: a gyász, a tagadás, a harag és a depresszió normális reakciók, ezért pszichológiai támogatás és rehabilitáció szükséges. A vak gyermekkel való kommunikáció során mindig szóval kell jelezni a jelenlétünket – például 'Én vagyok, Péter' –, érintés előtt figyelmeztetni kell, a környezetet szóban kell leírni, és nem mutogatni, hanem elmondani kell a dolgokat.`,

      { k: "Milyen csoportjai vannak a látássérülteknek?", v: "1. Gyengénlátók (látóélesség 0,1-0,3): segédeszközzel olvasnak. 2. Aliglátók (0,01-0,1): speciális módszerekkel. 3. Vakok (0,01 alatti vagy nincs fényérzékelés): tapintó és halló csatornák dominálnak." },

      { k: "Hogyan fejlődik a vak gyermek nyelvhasználata?", v: "Általában jó verbális képességek alakulnak ki, mert a hallás és a kommunikáció kompenzálja a látáshiányt – de a fogalmak tartalma szegényebb lehet." },
      { k: "Mi az önkiszolgálás speciális problémája látássérülteknél?", v: "Tájékozódás a saját testben és környezetben, öltözés, szépségápolás – ezeket szisztematikusan, tapintásos visszajelzéssel kell megtanítani." },
      { k: "Mi a támpontrendszerű közlekedés?", v: "A tájékozódási képzés módszere: a vak személy fix pontokat (tapintós jelzések, sarkok, hangjelzők) tanul meg, és ezek alapján navigál." },
      { k: "Mi az önkiszolgálás speciális higiéniás kérdése?", v: "A látássérültek számára speciális higiéniás segédeszközök szükségesek (pl. jelölt eszközök) és a mosdás/fürdés tapintásos visszajelzéssel tanítandó." },
      { k: "Hogyan vegyük figyelembe a látássérülés fokát a fejlesztésben?", v: "Gyengénlátónál: kontrasztos, nagyított nyomtatás, jó megvilágítás. Alig látónál: auditív anyagok, tapintás. Vaknál: teljesen tapintásos és auditív csatornák." },

      { k: "Mi a speciális intézmény szerepe vakok számára?", v: "A Vakok Általános Iskolájában speciálisan képzett szakemberek, megfelelő környezet és eszközök biztosítják az optimális fejlesztést." },
      { k: "Milyen segédeszközök léteznek a modern technikában?", v: "Képernyőolvasó szoftverek (JAWS, NVDA), Braille-kijelző, audiokönyvek, okostelefon hangvezérléssel, nagyítók." },
      { k: "Mi a látás elvesztésének pszichés hatása?", v: "Szerzett vakság esetén gyász, tagadás, harag, depresszió normális reakciók. Pszichológiai támogatás és rehabilitáció szükséges." },

  {
    id: 20,
    cim: "Hallássérülés",
    tetelSzoveg: "Ismertesse a hallássérülés fogalmát, okait, tüneteit, csoportjait! Mutassa be a hallássérültek nevelésének, oktatásának, gondozásának főbb jellemzőit! Ismertesse a hallássérülés hatásait a gyermek személyiségfejlődésére!",
    teljesLeiras: `A hallássérülés a hallás funkcionális károsodása, amely a kommunikáció, a nyelvfejlődés és a szociális beilleszkedés területein jelent nehézséget. Két fő csoportja van: a nagyothallók, akiknél enyhe-súlyos fokú a hallásveszteség, és hallókészülékkel kommunikálnak, valamint a süketek, akiknél nagyon súlyos a veszteség, és számukra a jelnyelv a fő kommunikációs forma. A halláscsökkenés fokozatai: enyhe huszonhat-negyven decibel, közepes negyvenegy-ötvenöt decibel, közepesen súlyos ötvenhat-hetven decibel, súlyos hetvenegy-kilencven decibel, és nagyon súlyos kilencvenegy decibel felett.

Fontos megkülönböztetni a prelingvális hallássérülést, amely a nyelv elsajátítása előtt, három éves kor előtt következik be, és a legkomolyabb hatással van a nyelvfejlődésre és a kommunikációra, valamint a posztlingvális hallássérülést, amely a nyelv elsajátítása után jelentkezik, ekkor a korábban elsajátított hangzó nyelvi készségek részben megmaradnak. A hallássérülés főbb okai lehetnek örökletesek, intrauterin fertőzés, mint a rubeola, szülési komplikáció, korai gyermekkori betegség, mint a meningitis, gyógyszerek mellékhatása, vagy zajártalom.

A jelnyelv vizuális-téri nyelv, amelyet kézjelek, arckifejezés és testmozgás kombinációjával használnak – teljes értékű, önálló nyelv, nem pusztán az orális nyelv vizuális kódja. A szájról olvasás, vagyis a szájmozgás megfigyeléséből történő jelentésazonosítás önmagában nehéz és megbízhatatlan, mivel sok hang azonosan látszik a szájon. A hallókészülék elektronikus eszköz, amely felerősíti a hangokat, és segít a nagyothallóknak, de süketeknél önmagában nem elegendő – számukra a cochleáris implantátum jelenthet megoldást, amely beültetett elektronikus eszközként közvetlenül a hallóideget stimulálja, és különösen korai beültetés esetén lehetővé teszi a hangok érzékelését.

A hallássérülés hatása a személyiségfejlődésre kettős lehet: egyrészt elszigeteltség érzése, kommunikációs frusztráció és alacsonyabb önértékelés alakulhat ki, másrészt erős süket közösségi identitás is kialakulhat – a süket kultúra fogalma azt fejezi ki, hogy a süketek saját közösséget, nyelvet és kultúrát alakítottak ki, és a süketséget sokan nem betegségként, hanem identitásként élik meg.

A gondozási feladatok közé tartozik a hallókészülék karbantartása, a fülhigiénia, a halló környezettel való kommunikáció segítése, a jelnyelv ismerete és a vizuális figyelem fejlesztése. A hallássérült gyermeknél való bejelentkezés vizuális jelzéssel, integetéssel vagy vállra érintéssel történik, nem szabad hátulról megszólítani, biztosítani kell a szemkontaktust és a jól megvilágított arcú kommunikációt. A bilingvális megközelítés a jelnyelv és a hangzó vagy írásos nyelv párhuzamos oktatását jelenti, ahol a jelnyelv az anyanyelv, a hangzó nyelv pedig az írásbeliség fejlesztését segíti. Az oktatás formái lehetnek a speciális iskola, az integrált nevelés hallókkal, vagy speciális osztály az általános iskolában.`,

      { k: "Mi a hallókészülék?", v: "Elektronikus eszköz, amely felerősíti a hangokat. Nagyothallóknak segít, de süketeknél nem elegendő." },
      { k: "Mi a cochleáris implantátum?", v: "Beültetett elektronikus eszköz, amely közvetlenül a hallóideget stimulálja – lehetővé teszi a hangok percepciójátsuketeknek, különösen ha korán kerül beültetésre." },
      { k: "Hogyan hat a hallássérülés a személyiségfejlődésre?", v: "Elszigeteltség érzése, kommunikációs frusztráció, alacsonyabb önértékelés lehetséges hatások – de erős süket közösségi identitás is kialakulhat." },
      { k: "Mi a süket kultúra fogalma?", v: "A süketek saját közösséget, nyelvet (jelnyelv) és kultúrát alakítottak ki – a süketség nem betegség, hanem kulturális identitás." },

      { k: "Mi a fülhigiénia kiemelten fontos feladata?", v: "A fülkanál és a hallókészülék rendszeres tisztítása – fertőzések megelőzése és a készülék megfelelő működésének biztosítása." },

      { k: "Milyen nevelési formák léteznek hallássérültek számára?", v: "Speciális iskola (süketek/hallássérültek iskolája), integrált nevelés hallókkal, speciális osztály általános iskolában." },
      { k: "Mi a hangfeldolgozási zavar?", v: "A hallószerv anatómiailag ép, de az agy nem dolgozza fel megfelelően a hangokat – hasonló tüneteket okoz, mint a halláscsökkenés, de más kezelést igényel." },

      { f: "Cochleáris implantátum", m: "Beültethető elektronikus eszköz, amely a hallóideget stimulálja – így a mély süket is tud hangokat érzékelni." },

      { f: "Szájról olvasás", m: "A halló ember szájmozgásából próbáljuk kitalálni, mit mond. Nehéz és megbízhatatlan – sok hang azonos mozgással ejthető." },

  {
    id: 21,
    cim: "Mozgáskorlátozottság",
    tetelSzoveg: "Ismertesse a mozgáskorlátozottság fogalmát, okait, típusait! Mutassa be a mozgáskorlátozottak nevelésének, oktatásának, gondozásának főbb jellemzőit, speciális eszközeit! Ismertesse a mozgáskorlátozottság hatásait a személyiség fejlődésére!",
    teljesLeiras: `A mozgáskorlátozottság a mozgásszervek károsodásából vagy elégtelen működéséből eredő állapot, amely a mozgás, az önkiszolgálás és a kommunikáció területén hoz létre funkciózavarokat. Okai lehetnek veleszületettek, mint az agybénulás vagy a végtaghiány, szerzettek, mint a baleset, a betegség vagy a daganat, vagy degeneratívak, mint az izombetegségek.

Az agybénulás, vagyis a cerebrális parézis a fejlődő agy nem progresszív károsodása, amely mozgásbeli és koordinációs zavarokat okoz, oka lehet szülési oxigénhiány, koraszülöttség vagy intrauterin fertőzés. Típusai a spasztikus forma, amelyre az izmok merevsége jellemző, az athetoid vagy diszkinetikus forma, amelyre a kontrollálatlan mozgások jellemzők, az ataxiás forma, amelyre az egyensúlyzavar jellemző, valamint a kevert típus. A végtagredukció veleszületett vagy szerzett, teljes vagy részleges végtaghiány, amelyet protézis, ortézis és speciális segédeszközök kompenzálhatnak. A petyhüdt bénulás a perifériás idegrendszer sérülése okozta bénulás, amelynél az izmok elvesztik tónusukat és sorvadhatnak, például gerincvelő-sérülés esetén.

A mozgáskorlátozottság hatása a személyiségfejlődésre attól is függ, hogy veleszületett vagy szerzett-e: veleszületett esetben a sérülés az identitás szerves részévé válik, szerzett esetben a gyász, a harag és a depresszió normális reakciók – mindkét esetben az elfogadás folyamata kulcsfontosságú. Fontos hangsúlyozni, hogy a mozgáskorlátozottság nem jár szükségszerűen intellektuális érintettséggel: cerebrális parézis esetén is lehet normál, sőt kiemelkedő intellektus.

Speciális taneszközei közé tartoznak a speciális íróeszközök, a gombalakos ceruza, a dőlt munkafelület, a könyöktámasz, valamint a szájjal vagy szemmel vezérelt számítógép és az érintőképernyő. Gyógyászati segédeszközei a tolókocsi – manuális vagy elektromos –, a járókeret, a cipekedő, a protézis, az ortézis és a speciális ülőbetét vagy matrac. A konduktív pedagógia, vagyis a Pető-módszer Pető András magyar fejlesztésű komplex rendszere, amelyben a mozgásfejlesztés és az oktatás integrálódik egymással, a gyermek aktív részvételével.

A nevelés sajátossága a lassabb tempó biztosítása, a mozgásos akadályok elhárítása, a segédeszközök alkalmazása, az önállóság maximális biztosítása és az érzelmi biztonság megteremtése. Az akadálymentesítés a fizikai környezet átalakítása mozgáskorlátozottak számára: rámpák, liftek, szélesebb ajtók, akadálymentes vizesblokk és speciális bútorok. Speciális gondozási feladat a pozicionálás, vagyis a megfelelő testhelyzet biztosítása, amely megelőzi a decubitus, vagyis a nyomásfekély kialakulását, és fenntartja a funkcionális testtartást, valamint a katéterezés, a gyógyszeradagolás és a fizikoterápia támogatása is.

A komplex rehabilitáció elve szerint orvosi, gyógytornász, gyógypedagógus, szociális munkás és pszichológus segítsége együttesen szükséges. A gyógypedagógiai asszisztens segíthet a mozgásban – a tolókocsi kezelésében, az ültetésben –, az öltöztetésben és vetkőztetésben, az étkezésben, a kommunikációban, és a szükségletek azonnali jelzésében, mindeközben szem előtt tartva az önállóság maximalizálásának elvét: csak annyi segítséget adunk, amennyi valóban szükséges, mert ez a méltóság alapja.`,
    kartya: [
      { k: "Mi a mozgáskorlátozottság fogalma?", v: "Mozgásszervek károsodásából vagy elégtelen működéséből eredő állapot, amely a mozgás, az önkiszolgálás és a kommunikáció területén hoz létre funkciós zavarokat." },
      { k: "Milyen okai vannak a mozgáskorlátozottságnak?", v: "Veleszületett (agybénulás, végtaghiány), szerzett (baleset, betegség, daganat), degeneratív betegségek (izombetegségek)." },
      { k: "Mi az agybénulás (cerebrális parézis)?", v: "A fejlődő agy nem progresszív károsodása, amely mozgásbeli és koordinációs zavarokat okoz. Oka: szülési oxigénhiány, koraszülöttség, intrauterin fertőzés." },
      { k: "Milyen típusai vannak az agybénulásnak?", v: "Spasztikus (izmok merevsége), athetoid/diszkinetikus (kontrollálatlan mozgások), ataxiás (egyensúlyzavar), kevert típus." },
      { k: "Mi a végtagredukció?", v: "Veleszületett vagy szerzett végtaghiány (teljes vagy részleges). Protézis, ortézis és speciális segédeszközök kompenzálhatják." },
      { k: "Mi a petyhüdt bénulás?", v: "A perifériás idegrendszer sérülése okozta bénulás – az izmok elvesztik tónusukat és sorvadhatnak (pl. gerincvelő-sérülés)." },
      { k: "Hogyan hat a mozgáskorlátozottság a személyiségfejlődésre?", v: "Veleszületett esetén: a sérülés az identitás részévé válik. Szerzett esetén: gyász, harag, depresszió normális reakciók. Mindkét esetben az elfogadás kulcsfontosságú." },

      { k: "Milyen gyógyászati segédeszközök léteznek?", v: "Tolókocsi (manuális, elektromos), járókeret, cipekedő, protézis, ortézis (rögzítő, korrekciós), ülőbetét, speciális matrac." },
      { k: "Mi a mozgáskorlátozottak nevelésének sajátossága?", v: "Lassabb tempó biztosítása, mozgásos akadályok elhárítása, segédeszközök alkalmazása, önállóság maximális biztosítása, érzelmi biztonság." },
      { k: "Mi az akadálymentesítés?", v: "A fizikai környezet átalakítása mozgáskorlátozottak számára: rámpák, lifteke, szélesebb ajtók, akadálymentes WC, speciális bútorok." },
      { k: "Mi a konduktív pedagógia (Pető-módszer)?", v: "A mozgáskorlátozottak komplex fejlesztési rendszere, amelyet Pető András fejlesztett ki. A mozgásfejlesztés és az oktatás integrálja egymást, a gyermek aktív részvételével." },
      { k: "Milyen gondozási sajátosságok jellemzők?", v: "Pozicionálás (megfelelő testhelyzet), nyomásfekélyek megelőzése, katéterezés, gyógyszeradagolás, fizikoterápia támogatása." },
      { k: "Mi a pozicionálás?", v: "A mozgáskorlátozott személy testének olyan helyzetbe hozása, amely megelőzi a decubitus (nyomásfekély) kialakulását és fenntartja a funkcionális testtartást." },
      { k: "Mit jelent az önállóság maximalizálása?", v: "Nem teszünk helyette olyat, amit ő is meg tud csinálni – csak a valóban szükséges segítséget adjuk meg. Az önállóság megőrzése a méltóság alapja." },
      { k: "Hogyan hat az iskolai sikertelenség a mozgáskorlátozott gyermekre?", v: "Ha a mozgáskorlátozott gyermeknek ép intelligenciája van, de a fizikai korlátok miatt nem tud teljesíteni, frusztrált, önértékelése romlik." },
      { k: "Mi az izomsorvadás (disztrófia)?", v: "Progresszív izombetegség, amely az izmok fokozatos gyengülésével és sorvadásával jár. Az állapot romlik – a fejlesztés a funkciók megőrzésére irányul." },
      { k: "Mi a komplex rehabilitáció elve?", v: "Orvosi (gyógyszerek, műtét) + gyógytornász + gyógypedagógus + szociális munkás + pszichológus – minden terület együttesen segít." },

      { k: "Mi a mozgáskorlátozottság és az intellektus kapcsolata?", v: "A mozgáskorlátozottság nem jár szükségszerűen intellektuális érintettséggel. Pl. cerebrális parézisben lehet normál, sőt kiemelkedő intellektus is." },

      { f: "Agybénulás (cerebrális parézis)", m: "A fejlődő agyban bekövetkező, nem progresszív sérülés, amely mozgásproblémákat okoz. Okai lehetnek: szülési oxigénhiány, koraszülöttség." },

  {
    id: 22,
    cim: "Beszédfogyatékosság",
    tetelSzoveg: "Ismertesse a beszédfogyatékosság fogalmát, okait, típusait, a beszédfogyatékosok nevelésének, oktatásának, gondozásának főbb jellemzőit, speciális eszközeit, valamint a logopédiai munka higiénés feladatait! Mutassa be a beszédfogyatékosság hatásait a személyiség fejlődésére!",
    teljesLeiras: `A beszédfogyatékosság a kommunikáció és a nyelvhasználat súlyos zavarainak összessége, amelyek a szokásos pedagógiai eszközökkel nem kezelhetők, és speciális logopédiai segítséget igényelnek. Okai lehetnek organikusak, mint az agysérülés, a szájüregi rendellenesség vagy a halláscsökkenés, funkcionálisak, mint a pszichés vagy környezeti tényezők, vagy ezek kombinációja.

A beszédfogyatékosság főbb típusai a beszédfejlődés elmaradása, a hangzáshibák, mint a pöszeség vagy az orrhangzósság, a hangképzési zavarok, vagyis a dysfonia, a folyamatosság zavarai, mint a dadogás és a hadarás, az afázia, valamint a mutizmus. A dadogás a beszéd folyamatosságának zavara, amelyet ismétlések, nyújtások és blokkok jellemeznek – a stressz fokozza, a nyugodt légkör csökkenti a tüneteit. A hadarás túl gyors, ritmustalan, nehezen érthető beszéd, amelynél a gondolat mintegy megelőzi az artikulációt – ezt sokszor maga a hadaró sem veszi észre. A pöszeség a hangok hibás képzése, például amikor a gyermek 's' helyett 'sz'-t, vagy 'r' helyett 'l'-t ejt, és logopédiai terápiával korrigálható. A hangképzési zavar, vagyis a dysfonia a hang minőségének, magasságának vagy erősségének zavara, ami rekedtségben, hangelvesztésben vagy kettős hangban nyilvánulhat meg, oka lehet a gége sérülése vagy funkcionális tényező. Az afázia agysérülés, például stroke után fellépő állapot, amikor a már megtanult nyelv elvész: a személy nem tud szólni, vagy nem érti, amit mondanak neki.

A dadogás komoly hatással lehet a személyiségfejlődésre: szégyent, szorongást, elkerülő magatartást és alacsony önértékelést okozhat, de megfelelő terápiával és elfogadással ezek a hatások jelentősen csökkenthetők. A dadogó gyermeknél a segítő legfontosabb feladata, hogy türelmesen megvárja a mondanivalóját, ne fejezze be helyette a mondatot, ne siettesse, tartsa fenn a szemkontaktust, és ne reagáljon külön a dadogásra.

A logopédiai fejlesztést minél korábban érdemes elkezdeni, mert az idegrendszeri plaszticitás miatt a korai fejlesztés a leghatékonyabb. Logopédiai vizsgálatra akkor érdemes fordulni, ha a gyermek kétévesen nem mond szavakat, hároméves korban nem alkot mondatokat, vagy ötéves korban nehezen érthető a beszéde. A kommunikatív kompetencia fogalma nemcsak a helyes grammatikát jelenti, hanem a megfelelő szociális helyzetben való hatékony kommunikáció képességét is, amit szintén a logopédiai munka fejleszt.

A logopédiai munka higiénés feladatai közé tartozik a száj- és fülüreg higiéniájának figyelemmel kísérése: ezek elhanyagolása fülgyulladáshoz vagy fogínygyulladáshoz vezethet, amelyek tovább ronthatják a halló- és beszédfunkciókat. Szoros a kapcsolat a hangos olvasás és a logopédiai munka között is: az olvasástanulás megerősíti az artikulációs mozgásokat, ezért a logopédus és a pedagógus összehangoltan dolgozik az olvasásfejlesztésben.`,
    kartya: [
      { k: "Mi a beszédfogyatékosság fogalma?", v: "A kommunikáció és a nyelvhasználat súlyos zavarainak összessége, amelyek a szokásos pedagógiai eszközökkel nem kezelhetők, speciális logopédiai segítséget igényelnek." },
      { k: "Mik a beszédfogyatékosság okai?", v: "Organikus (agysérülés, szájüreg rendellenesség, halláscsökkenés), funkcionális (pszichés, környezeti), kevert." },
      { k: "Melyek a beszédfogyatékosság főbb típusai?", v: "1. Beszédfejlődés elmaradása. 2. Hangzáshibák (pöszeség, orrhangzósság). 3. Hangképzési zavarok (dysfonia). 4. Folyamatosság zavarai (dadogás, hadarás). 5. Afázia. 6. Mutizmus." },
      { k: "Mi a dadogás?", v: "A beszéd folyamatosságának zavara – ismétlések, nyújtások, blokkok jellemzik. Stressz fokozza, nyugodt légkörben csökken." },
      { k: "Mi a hadarás?", v: "Túl gyors, ritmustalan, nehezen érthető beszéd – a gondolat 'megelőzi' az artikulációt. Sokszor nem tudatosul a hadaróban." },
      { k: "Mi az afázia?", v: "A már kialakult szóbeli és/vagy írásbeli nyelv elvesztése, agykárosodás következtében (pl. stroke). A logopédia segíthet a visszaszerzésben." },
      { k: "Mi a mutizmus?", v: "A kommunikációra való képtelenség pszichés okokból – organikus ok nélkül nem tud vagy nem akar szólalni. Pszichiátriai és logopédiai segítség szükséges." },
      { k: "Mi az integráció lehetőségei beszédfogyatékosok esetén?", v: "Enyhe esetben az általános iskolai integráció logopédiai megsegítéssel megvalósítható – súlyosabb esetben speciális intézmény indokolt." },
      { k: "Mi a logopédia?", v: "A beszéd- és kommunikációs zavarok prevenciójával, diagnosztizálásával és terápiájával foglalkozó tudományterület és szakma." },
      { k: "Milyen speciális eszközöket alkalmaz a logopédia?", v: "Tükör (artikuláció megfigyelése), hangolók, fúvókák, képkártyák, szoftverek, AAK-eszközök, dallamos intonáció terápia." },
      { k: "Milyen higiénés feladatok jellemzők a logopédiai munkában?", v: "Az eszközök (szívócsövek, spatulák, fúvókák) sterilizálása vagy egyszer használatos volta, kézhigiénia, nyálvédelem – a szájüreg érintésével járó munka higiénés protokollja." },
      { k: "Hogyan hat a dadogás a személyiségfejlődésre?", v: "Szégyen, szorongás, elkerülő magatartás, alacsony önértékelés – de megfelelő terápiával és elfogadással ezek csökkenthetők." },
      { k: "Hogyan segíthet az asszisztens dadogó gyermeknél?", v: "Türelmesen megvárjuk a mondanivalóját, nem fejezzük be helyette, nem siettetjük, fenntartjuk a szemkontaktust, nem reagálunk a dadogásra.'" },
      { k: "Mi a kommunikatív kompetencia fogalma?", v: "Nem csak helyes grammatika, hanem a megfelelő szociális helyzetben való hatékony kommunikáció képessége is – ezt is fejleszti a logopédia." },
      { k: "Mi a hangképzési zavar (dysfonia)?", v: "A hang minőségének, magasságának, erősségének zavara – rekedtség, hang elvesztése, kettős hang. Gége sérülése, funkcionális ok." },
      { k: "Mi a pöszeség?", v: "Hangok hibás képzése – pl. 's' hang helyett 'sz' ejt a gyerek, vagy 'r' helyett 'l'. Logopédiai terápiával korrigálható." },
      { k: "Mikor kezdjük a logopédiai fejlesztést?", v: "Minél korábban, annál hatékonyabb. Az idegrendszeri plaszticitás miatt korai fejlesztés a legeredményesebb." },
      { k: "Mi a gyermeknyelvfejlődés tipikus üteme és mikor kell logopédushoz fordulni?", v: "Ha 2 évesen nem mond szavakat, 3 évesen nem alkot mondatokat, 5 évesen nehezen értik, akkor logopédiai vizsgálat szükséges." },
      { k: "Hogyan hat a száj és fülüreg higiéniájának elhanyagolása?", v: "Fülgyulladások, fogínygyulladás – ezek tovább ronthatják a halló- és beszédfunkciókat." },
      { k: "Mi a hangos olvasás és a logopédiai munka kapcsolata?", v: "Az olvasástanulás megerősíti az artikulációs mozgásokat – a logopédus és a pedagógus összhangban dolgozik az olvasásfejlesztésben." },

      { f: "Beszédfogyatékosság", m: "Súlyos kommunikációs zavar – nem csak 'csúnyán beszél', hanem a kommunikáció maga akadályozott. Logopédiai segítség szükséges." },
      { f: "Dadogás", m: "A folyamatos, gördülékeny beszéd zavara – ismételget, megakad, elnyújtja a szavakat. Stressz rontja, nyugodt légkör segít." },

  {
    id: 23,
    cim: "Autizmus spektrumzavar",
    tetelSzoveg: "Mutassa be az autizmus spektrumzavar fogalmát, okait, kritériumait, nevelésük, oktatásuk főbb jellemzőit! Ismertesse az autizmus spektrumzavar pszichológiai hátterét, sajátosságait! Mutassa be a protetikus környezet fogalmát, eszközeit!",
    teljesLeiras: `Az autizmus spektrumzavar a fejlődés átható, neurológiai alapú zavara, amely a szociális kommunikáció és interakció, valamint a rugalmas viselkedés és érdeklődés területén okoz jellemző nehézségeket. Pervazív, vagyis átható fejlődési zavarról van szó, ami azt jelenti, hogy nem egy-egy területet érint, hanem az egész személyiséget befolyásolja. A diagnózis két fő kritériumon alapul, amelyeknek egyszerre kell fennállniuk: tartós hiányosságok a szociális kommunikációban és interakcióban, valamint korlátozott, repetitív viselkedés, érdeklődés és tevékenység.

A szociális kommunikációs nehézségek közé tartozik a szemkontaktus kerülése, az érzelmek értelmezésének nehézsége, a kölcsönös párbeszéd problémái és a nonverbális kommunikáció zavara. A repetitív viselkedés formái közé tartoznak a sztereotip mozgások, mint a kézrázás vagy a forgás, a ritualisztikus szokások, a változatlansághoz való ragaszkodás és a speciális, szűk érdeklődési körök.

Az autizmus pszichológiai hátterét több hipotézis is megpróbálja magyarázni. Baron-Cohen naiv tudatelmélet-hipotézise szerint az autizmus spektrumzavarral élők nehézséget mutatnak mások elmeállapotainak, vagyis gondolatainak, szándékainak és érzéseinek megértésében. A végrehajtó működési zavar hipotézise szerint a jellemző merevség és az ismétlő viselkedés a végrehajtó funkciók – tervezés, rugalmasság, impulzusszabályozás – zavarával magyarázható. A gyenge centrális koherencia hipotézise szerint az érintettek a részletekre koncentrálnak az egész rovására – nem látják 'az erdőt a fáktól', viszont apró részleteket gyakran kiemelkedően jól észrevesznek.

Fontos hangsúlyozni, hogy az autizmus spektrumzavar minden intelligenciaszinten előfordulhat, magas intelligencia esetén is, mint az Asperger-szindrómánál, és alacsonyabb intelligencia esetén is – az intelligencia és az autizmus spektrumzavar egymástól független dimenziók.

A nevelés-oktatás egyik kulcsfogalma a protetikus környezet: ez egy, az autizmus spektrumzavarral élő személyre szabott fizikai és szervezeti környezet, amely kiszámítható, strukturált, és csökkenti a változásból fakadó szorongást. Eszközei közé tartozik a képes napirend, amely sorban mutatja a nap folyamán következő tevékenységeket, a tér strukturálása, vagyis hogy egy-egy tevékenységhez konkrét fizikai helyet rendelünk, az idő vizuális megjelenítése, például időzítővel, a tevékenységszervező kártyák és a zajcsillapítás. A vizuális támogatottság azt jelenti, hogy az elvárásokat, a napirendet és a szabályokat képi, rajzos, szimbolikus formában tesszük láthatóvá, hiszen az autizmus spektrumzavarral élők jellemzően vizuálisan dolgozzák fel hatékonyabban az információt. A PECS, vagyis a Picture Exchange Communication System egy képkártyák cseréjén alapuló kommunikációs rendszer azoknak, akik nonverbálisak vagy keveset kommunikálnak szóban.

A rutinok és rituálék fenntartása biztonságot ad, mert a változtatás intenzív szorongást okozhat, ezért minden változásra előzetes felkészítés szükséges. Sok autizmus spektrumzavarral élő embernek érzékszervi feldolgozási különbségei is vannak: lehet hiperszenzitív, amikor a hangok fájdalmasan erősnek tűnnek, vagy hiposzenzitív, amikor érzéketlenebb a tapintásra. Az ABA-terápia, vagyis az Applied Behavior Analysis viselkedéselemzésen alapuló, intenzív fejlesztési módszer, amely megerősítéssel tanítja a kívánt viselkedéseket. Az oktatási formák lehetnek speciális autizmus-iskola, integrált osztály autizmus-specifikus módszerekkel, vagy egyéni fejlesztés, a szint és az igények alapján. Az autizmus spektrumzavarral élő gyermekkel való kommunikáció során egyértelműen, konkrétan, rövid mondatokban, vizuális kiegészítéssel kell beszélni, kerülve a nem szó szerint értendő kifejezéseket, mint az irónia vagy a metafora, és mindig türelemmel.`,
    kartya: [
      { k: "Mi az autizmus spektrumzavar (ASZ)?", v: "A fejlődés átható neurológiai zavara, amely a szociális kommunikáció és interakció, valamint a rugalmas viselkedés és érdeklődés területein okoz jellemző nehézségeket." },
      { k: "Mi a fejlődési zavar (pervazív zavar) fogalma?", v: "Átható, az egész személyiséget érintő fejlődési zavar – nem egy-egy területet érint, hanem az összes pszichikus funkciót befolyásolja." },
      { k: "Mik az autizmus spektrumzavar diagnózis kritériumai?", v: "1. Tartós hiányosságok a szociális kommunikációban és interakcióban. 2. Korlátozott, repetitív viselkedés, érdeklődés és tevékenységek. Mindkettő szükséges." },

      { k: "Mik a repetitív viselkedés formái ASZ-ben?", v: "Sztereotip mozgások (kézrázás, forgás), ritualisztikus szokások, ragaszkodás a változatlansághoz, speciális érdeklődési körök." },
      { k: "Mi a naiv tudatelmélet (Theory of Mind) hipotézise?", v: "Baron-Cohen: az autizmus spektrum zavarral élők nehézséget mutatnak mások elmeállapotainak (gondolatok, szándékok, érzések) megértésében." },

      { k: "Mi a gyenge centrális koherencia hipotézise?", v: "Az autizmus spektrum zavarral élők részletekre koncentrálnak az egész rovására – nem látják az 'erdőt a fáktól', de apró részleteket észrevesznek." },
      { k: "Mi a protetikus környezet?", v: "Olyan, az ASZ-es személyre szabott fizikai és szervezeti környezet, amely kiszámítható, strukturált, és csökkenti az átalakodásból fakadó szorongást." },
      { k: "Mik a protetikus környezet eszközei?", v: "Képes napirend, tér strukturálása (sarok, rekeszek), idő vizuális megjelenítése (timer), tevékenységszervező kártyák, zajcsillapítás." },
      { k: "Mi a vizuális támogatottság?", v: "Képes, rajzos, szimbolikus formában teszi láthatóvá az elvárásokat, napirendet, szabályokat – az ASZ-es személyek inkább vizuálisan dolgozzák fel az információt." },
      { k: "Mi a PECS kommunikációs rendszer?", v: "Picture Exchange Communication System – képkártyák cseréjén alapuló kommunikációs rendszer nonverbális vagy keveset kommunikáló ASZ-es személyeknek." },
      { k: "Hogyan zajlik a tér strukturálása ASZ-nél?", v: "Különböző tevékenységekhez különböző fizikai helyek rendelése – 'ez az evés helye', 'ez a tanulás helye'. Ez csökkenti a bizonytalanságot." },
      { k: "Mi a képes napirend?", v: "Képek sorozata, amelyek mutatják, mi fog következni a nap folyamán. Az ASZ-es személy előre láthatja a napi rendet – ez csökkenti a szorongást." },
      { k: "Hogyan segíti a rutinok és rituálék fenntartása?", v: "Az ASZ-es személyek biztonságot találnak a kiszámítható rutinokban – változtatás intenzív szorongást okozhat. Előzetes felkészítés szükséges változáskor." },

  {
    id: 24,
    cim: "Diszlexia, diszgráfia, diszkalkulia, Meixner-módszer",
    tetelSzoveg: "Ismertesse a diszlexia, diszgráfia, és a diszkalkulia fogalmakat, jellemezze tüneteiket, valamint nevelésük, oktatásuk főbb jellemzőit! Mutassa be a Meixner-módszer sajátosságait!",
    teljesLeiras: `A diszlexia átlagos vagy átlag feletti intelligencia mellett fennálló, neurológiai alapú, specifikus olvasási nehézség, amely a betű-hang megfeleltetés, a szófelismerés és a szövegértés területén jelentkezik. Tünetei közé tartozik a lassú és pontatlan olvasás, a betűcsere, a kihagyás vagy beillesztés, a szótagolás nehézsége, a gyenge szövegértés és az elmaradott helyesírás. Neurológiai háttere a fonológiai feldolgozás zavarában, valamint a bal agyfélteke olvasási régiójának eltérő működésében keresendő, ami genetikailag is meghatározott, és strukturális eltérések MRI-vizsgálattal is kimutathatók. Fontos elhatárolni az általános tanulási nehézségtől: a diszlexia esetében a normális intelligencia ellenére áll fenn egy specifikus olvasási zavar, míg az általános tanulási nehézség több területet érint, és gyakran intellektuális érintettséggel is jár.

A diszgráfia szintén neurológiai alapú, specifikus írászavar, amelynél az írástechnika és az írásbeli kifejezés tartósan nehezített, a motoros koordináció és a fonetikai kódolás zavarai miatt. Tünetei az olvashatatlan írás, a betűk és számok tükrözése, a szabálytalan betűméret, a nagyon lassú írástempó és a tollal való nehéz bánásmód. A diszkalkulia neurológiai alapú, specifikus számolási és matematikai képességzavar, amely az aritmetikai alapműveletek, a számfogalom és a matematikai gondolkodás területén jelentkezik, normál intelligencia mellett – tünetei a számjegyek tükrözése, a rossz helyiérték-kezelés, a műveletek sorrendjének felcserélése, a matematikai fogalmak megértésének nehézsége és a szöveges feladatok megoldásának nehézsége.

A Meixner-módszert Meixner Ildikó dolgozta ki, kifejezetten a diszlexiára hajlamos és diszlexiás gyermekek olvasás- és írástanítására. Alapelvei a hangonkénti tanítás, a játékos-mesés keretezés, a homogén gátlás csökkentése, a fokozatosság, a sok ismétlés és a multiszenzoros feldolgozás. A homogén gátlás azt jelenti, hogy a hasonló hangok – például p-b vagy d-t – egymáshoz közeli tanítása interferenciát, vagyis zavart okoz, ezért a Meixner-módszer ezeket szándékosan eltávolítja egymástól az oktatás sorrendjében. A hármas asszociáció elve a betű-hang megfeleltetés kialakítását jelenti három érzékszervi csatornán egyszerre: a látás – a betű –, a hallás – a hang – és a mozgás – az írás és az artikuláció mozgása – együttesen erősítik meg a tanulást.

A diszlexia prevenciója azt jelenti, hogy az óvodáskorban azonosítható kockázati tényezőket korai logopédiai és fejlesztő beavatkozással csökkenthetjük, még mielőtt az olvasástanítás elkezdődne, a reedukáció pedig a már kialakult olvasási zavar logopédiai terápiáját jelenti, vagyis az olvasási mechanizmus újratanítását speciális módszerekkel. A diszlexiás tanuló törvényi jogosultságai közé tartozik az időkedvezmény, a szóbeli felelet elfogadása írásbeli helyett, az értékelési könnyítések, és a segédeszközök, mint a számítógép vagy a szövegfelolvasó program használata. A diszkalkuliás tanulót számegyenes, abakusz, manipulatív eszközök, számológép felsőbb osztályban, táblázatok és vizuális segédletek segíthetik.

A gyógypedagógiai asszisztens diszlexiás gyermeknél a feladatokat szóban is elmagyarázza, az írást részben más feladatformával váltja ki, türelmesen visszaolvas, és nem sürgeti, nem kelt szégyenérzetet a gyermekben. Az olvasástanítás multiszenzoros megközelítése – a látás, a hallás, a tapintás és a mozgás egyidejű bevonása – minden csatornán erősít, így a gyenge csatornát is kompenzálni tudja. A diszlexiás gyermek önértékelés-problémáinak kezelésében kulcsfontosságú a sikerélmények biztosítása, az erősségek kiemelése, a zavarról szóló nyílt, nem megbélyegző kommunikáció, és a kortársak elfogadásának elősegítése.`,
    kartya: [

      { k: "Mik a diszlexia tünetei?", v: "Lassú és pontatlan olvasás, betűcsere, kihagyás, beillesztés, szótagolás nehézsége, gyenge szövegértés, elmaradott helyesírás." },

      { k: "Mi a diszlexia prevenció?", v: "Az óvodáskorban azonosítható kockázati tényezők korai logopédiai és fejlesztő beavatkozással csökkenthetők – mielőtt az olvasástanítás megkezdődik." },

      { k: "Milyen segédeszközök segítik a diszkalkuliást?", v: "Számegyenes, abakusz, manipulatív eszközök (kockák), számológép (felsőbb osztályban), táblázatok, vizuális segédletek." },
      { k: "Mi az olvasástanítás multiszenzoros megközelítése?", v: "Látás, hallás, tapintás, mozgás egyidejű bevonása az olvasás-írástanításba – minden csatornán erősít, így a gyenge csatornát kompenzálja." },
      { k: "Hogyan kezeljük a diszlexiás gyerek önértékelés-problémáját?", v: "Sikerélmények biztosítása, erősségek kiemelése, a zavarról szóló nyílt, nem stigmatizáló kommunikáció, kortársak elfogadásának elősegítése." },
    ],
    fogalmak: [
      { f: "Diszlexia", m: "Normális intelligencia mellett fennálló olvasási nehézség – nem lustaság vagy figyelmetlenség, hanem neurológiai különbség. A betű-hang kapcsolat tanulása nehéz." },
      { f: "Diszgráfia", m: "Az írás nehézséges és nehezen olvasható, hiába próbál – az agy és a kéz koordinációjának neurológiai zavara." },
      { f: "Diszkalkulia", m: "A matematika specifikus nehézsége – nehéznek tűnik a számfogalom, az összeadás, a helyi értékes kezelés, miközben más területeken jól teljesít." },
      { f: "Meixner-módszer", m: "Magyar fejlesztésű, diszlexiásoknak kidolgozott olvasástanítási módszer. Lassan, játékosan, hangonként haladva tanítja az olvasást." },

      { f: "Reedukáció", m: "Újratanítás – ha valaki diszlexiás, logopédiai terápiával az olvasást speciális módszerekkel tanítják újra." },

  {
    id: 25,
    cim: "Súlyos-halmozott fogyatékosság, fejlesztő nevelés",
    tetelSzoveg: "Mutassa be a súlyos-halmozott fogyatékosság fogalmát, okait, valamint nevelésük, gondozásuk főbb jellemzőit! Ismertesse a fejlesztő nevelés, gondozás területeit, alapelveit!",
    teljesLeiras: `A súlyos-halmozott fogyatékosság két vagy több fogyatékosság egyidejű fennállását jelenti, amelyek együttesen súlyos mértékben korlátozzák az önálló tevékenységet, a kommunikációt és az önkiszolgálást. Okai jellemzően genetikaiak, mint az Angelman-szindróma vagy a Rett-szindróma, pre- és perinatális agykárosodás, metabolikus betegségek vagy infekciók – legtöbbször organikus eredetűek. A súlyos-halmozottan fogyatékos személynél a verbális kommunikáció legtöbbször nem alakul ki, ezért a fő kommunikációs formát a nonverbális jelzések – hangok, mimika, gesztusok, testmozgás – jelentik.

A fejlesztő nevelés-oktatás célkitűzése ezeknél a tanulóknál nem a tantárgyi tudás, hanem az alapvető készségek, funkciók és az életminőség javítása a kommunikáció, a mozgás, az önkiszolgálás, valamint az érzékelés-észlelés területén. A fejlesztő nevelés hat fő területe a kommunikáció, a mozgás, az érzékelés-észlelés, a kreativitás, a szociális kapcsolatok és az önkiszolgálás. A fejlesztő gondozás területei az ürítés segítése, a tisztálkodás, az öltözés-vetkőzés, az étkezés, a pozicionálás, a gyógyszerelés és a bőrápolás – tehát minden napi tevékenység támogatása.

A fejlesztő nevelés alapelvei a holisztikus szemlélet, az egyénre szabottság, a következetesség, az aktivitás prioritása, a família bevonása, az interdiszciplináris együttműködés és a méltóság tisztelete. A szenzoros stimuláció tudatos érzékszervi ingerek nyújtását jelenti – hang, fény, tapintás, szag, mozgás –, célja a megismerő funkciók aktiválása és az öröm szerzése. Ehhez kapcsolódik a Snoezelen módszer, amely multiszenzoros terápiás eljárás: speciális helyiségben hang-, fény-, szag- és tapintásingerek kombinálásával nyugalmat, örömöt és élményt nyújtunk. A basale stimuláció Fröhlich és Bienstein nevéhez fűződő módszer, amely az alapvető testérzékelés, a légzés és a mozgásészlelés tudatos stimulálását jelenti korlátozott képességű személyeknél.

Az étkezés segítésénél fontos a megfelelő testhelyzet biztosítása, az ételkonzisztencia – esetenként pépes étel – kiválasztása, a speciális evőeszközök használata, a lassú etetés, és az aspiráció megelőzése: az aspiráció azt jelenti, hogy étel, ital vagy nyál véletlenül a légutakba kerül, ami súlyos esetben tüdőgyulladást vagy fulladást okozhat, ezért étkezésnél kiemelt figyelmet igényel. Az ürítés segítésének speciális feladatai a rendszeres ültetés a WC-re, az ürítési jelzések figyelése, a pelenkacsere megfelelő technikája és a bőrápolás a bőrkárosodás megelőzésére. Az öltözés-vetkőzés során az aktív részvétel minden apró mozzanatát ösztönözni kell – akár csak annyit is, hogy a gyermek felemeli a kezét öltöztetéskor.

A 'legkisebb ellenállás' elve azt jelenti, hogy a gondozást a személy ritmusára és jelzéseire igazítjuk, nem a gondozó kényelméhez – ez egy empatikus, személyre szabott gondozási szemlélet. A súlyos-halmozottan fogyatékos személyek is tankötelesek, amit a fejlesztő nevelés-oktatás keretében, iskolai vagy akár otthoni ellátás formájában teljesíthetnek. Életútjuk jellemzően a korai fejlesztéstől a fejlesztő nevelés-oktatáson át a felnőttkori intézményi ellátásig – lakóotthon, nappali intézmény – majd a speciális idősellátásig vezet. A família bevonása kiemelten fontos: a szülők megtanulják a fejlesztési módszereket, beépítik az otthoni rutinba, és visszajelzést adnak a szakembereknek. A zene terápiás szerepe is jelentős, mert ott is emocionális reakciókat tud kiváltani, ahol a verbális kommunikáció nem lehetséges – örömet, nyugalmat és kommunikációt segíthet elő. A fejlesztő nevelés eredményeit rendszeres megfigyelési naplóval, fényképes vagy videós dokumentációval, és az egyéni fejlesztési terv rendszeres felülvizsgálatával követjük nyomon.`,

      { k: "Mi az aspiráció veszélye?", v: "Étel, ital vagy nyál véletlenül a légutakba kerül – súlyos esetben tüdőgyulladást vagy fulladást okozhat. Étkezésnél különösen figyelni kell." },

      { k: "Hogyan vonjuk be a famíliát a fejlesztésbe?", v: "A szülők megtanulják a fejlesztési módszereket, otthoni rutinokba beépítik, visszajelzést adnak a szakembereknek – együttműködés kulcsfontosságú." },

    fogalmak: [

      { f: "Fejlesztő nevelés-oktatás", m: "Nem tantárgyakat tanítunk, hanem alapvető funkciókat fejlesztünk: kommunikáció, evés, öltözés. Minden kis lépés érték." },
      { f: "Szenzoros stimuláció", m: "Tudatos érzékleti ingerek nyújtása – hang, fény, tapintás. Aktivizálja az érzékelést és örömet szerez ott is, ahol a kommunikáció korlátozott." },

  {
    id: 26,
    cim: "Aktivitás és figyelem zavarai – ADHD",
    tetelSzoveg: "Mutassa be az aktivitás és a figyelem zavarait! Ismertesse a hiperaktivitás, a figyelemzavar és az impulzivitás fogalmakat, jellemezze tüneteiket! Értelmezze nevelésük, oktatásuk, beilleszkedésük sajátosságait!",
    teljesLeiras: `Az ADHD, vagyis a figyelemhiányos hiperaktivitászavar neurológiai alapú fejlődési zavar, amely a figyelemben, az aktivitásban és az impulzuskontrollban okoz tartós nehézséget. Három fő tünetcsoportja van. A figyelemzavar azt jelenti, hogy a gyermek nem tudja tartósan egy dologra tartani a figyelmét – nem szándékosan kalandozik el, hanem az agya nehezebben tartja fókuszban az ingereket. A hiperaktivitás a fokozott, gyakran célnélküli mozgásigényt jelenti – mintha 'motort raktak volna bele' –, nehezen ül csendben, gyakran felkel, izeg-mozog. Az impulzivitás gátlási nehézség: a gyermek cselekszik, mielőtt gondolkodna, közbeszól, nem várja meg a sorát, és könnyen kerül kockázatos helyzetekbe.

Az ADHD tünetei életkoronként eltérő képet mutatnak. Kisgyermekkorban motoros nyugtalanság, gyakori balesetek, várakozási nehézség, türelmetlenség, érzelmi ingerlékenység és a szabálykövetés nehézségei jellemzők. Iskoláskorban előtérbe kerül a feladatszervezési nehézség, a felejtés, az elveszett tárgyak, a tanórai figyelmetlenség és a hosszú feladatokon való végigmenés képtelensége. Serdülő- és felnőttkorban a rizikómagatartás, az iskolai alulteljesítés, a szervezési és időbeosztási nehézségek, valamint a kapcsolati feszültségek kerülnek előtérbe.

Neurológiai háttere a prefrontális kéreg, vagyis a végrehajtó funkciókért felelős agyterület, valamint a dopaminerg rendszer eltérő működésében keresendő, és genetikailag is meghatározott, tehát öröklődhet. Fontos hangsúlyozni, hogy az ADHD önmagában nem csökkenti az intelligenciát, viszont a figyelemzavar és a végrehajtó funkciók gyengesége erősen ronthatja az iskolai teljesítményt.

Az ADHD-s gyermek beilleszkedését is jelentősen befolyásolja az állapot: az impulzív viselkedés és a szabályszegés zavarhatja a társakat, ezért a gyermek sokszor kiszorul a csoportból – emiatt a szociális készségek célzott fejlesztése kulcsfontosságú. A nevelés leghatékonyabb eszközei a következetes, kiszámítható struktúra, a rövid feladatok, az azonnali visszajelzés, a sok mozgáslehetőség, a feladatok kisebb egységekre bontása és a pozitív megerősítés: az ADHD-s gyermek büntetés helyett sokkal jobban reagál jutalomra, ezért az elvárt viselkedést azonnali, konkrét dicsérettel érdemes megerősíteni.

Az iskolai gyakorlatban gyakran segít, ha az ADHD-s gyermek az első sorban, a tanár közelében, háttal az ablaknak ül, mert ez csökkenti az elterelő ingereket, és érdemes elkerülni a zajos padszomszédot is. A gyógypedagógiai asszisztens a feladatok kisebb részekre bontásával, időmérő használatával, vizuális tervezővel, mozgáslehetőség biztosításával, azonnali visszajelzéssel és az érzelmi szabályozás segítésével támogathatja a gyermeket. Súlyosabb esetben a gyógyszeres kezelés is szóba jöhet: a metilfenidát és más szerek a dopaminerg rendszert segítik, csökkentve a figyelmetlenséget és a hiperaktivitást, de ennek szükségességéről mindig az orvos dönt.

Fontos eloszlatni az ADHD-val kapcsolatos tévhiteket is: nem igaz, hogy 'csak figyelni kellene', hiszen ez egy neurológiai zavar, nem lustaság; nem igaz, hogy a gyermek 'kinövi', mert felnőttkorban is fennmaradhat; és nem igaz, hogy minden hiperaktív gyermeknek ADHD-ja van. Az iskola az egyéni fejlesztési terv, az értékelési könnyítések, az időkedvezmény és az asszisztensi segítség eszközeivel tudja kezelni az ADHD-s tanuló nehézségeit. A hiperaktív gyermek komoly stresszt jelenthet a famíliának is: a szülők gyakran kimerülnek, és a testvérkapcsolat is megsínylheti, ezért a szülőtámogatás és a szülői tréning a kezelés fontos részét képezi. A kommunikáció során rövid, egyértelmű utasításokat érdemes adni, szemkontaktust biztosítani, az utasítást szükség esetén megismételni, visszakérdezni – 'mutasd meg, mit kell csinálni' –, és mindvégig következetesnek maradni.`,
    kartya: [
      { k: "Mi az ADHD fogalma?", v: "Attention Deficit Hyperactivity Disorder – figyelemhiányos hiperaktivitászavar. Neurológiai alapú fejlődési zavar, amely a figyelemben, az aktivitásban és az impulzuskontrollban okoz tartós nehézséget." },
      { k: "Mik az ADHD típusai?", v: "1. Elsősorban figyelemzavar típus (ADD). 2. Elsősorban hiperaktív-impulzív típus. 3. Kombinált típus (legelterjedtebb)." },
      { k: "Mi a hiperaktivitás?", v: "Tartósan megnövekedett, helyzethez nem illő motoros aktivitás – nem tud csendesen ülni, állandóan mozog, futkározik, felkel." },
      { k: "Mi a figyelemzavar?", v: "Tartós, következetes nehézség a szándékos figyelem fenntartásában – hamar elterelhető, feladatot nem fejez be, részletekre nem figyel." },
      { k: "Mi az impulzivitás?", v: "Gátlási nehézség – cselekszik, mielőtt gondolkodna. Közbeszól, nem vár sort, kockázatos helyzetekbe keveredik." },
      { k: "Mik az ADHD tünetei kisgyermekkorban?", v: "Motoros nyugtalanság, balesetek, nem tud megvárni, türelmetlen, érzelmileg ingerlékeny, szabálykövetés nehézkes." },
      { k: "Mik az ADHD tünetei iskoláskorban?", v: "Feladatszervezési nehézség, felejtés, elveszett tárgyak, tanórai figyelmetlenség, hosszú feladatokon nem tud végigmenni, szétszórtság." },
      { k: "Mik az ADHD tünetei serdülőkorban és felnőttkorban?", v: "Serdülőben: rizikomagatartás, iskolai alulteljesítés. Felnőttben: szervezési nehézség, időbeosztási probléma, kapcsolati feszültségek." },
      { k: "Hogyan hat az ADHD a beilleszkedésre?", v: "Az ADHD-s gyerek sokszor kizárt a csoportból – impulzív viselkedése, szabályszegése zavarja a társakat. Szociális készségek fejlesztése kulcsfontosságú." },
      { k: "Mi az ADHD neurológiai háttere?", v: "A prefrontális kéreg (végrehajtó funkciók) és a dopaminerg rendszer eltérő működése. Genetikailag meghatározott – öröklhetős." },
      { k: "Mi az ADHD és a tanulási teljesítmény kapcsolata?", v: "Az ADHD önmagában nem csökkenti az intelligenciát, de a figyelemzavar és a végrehajtó funkciók gyengesége az iskolai teljesítményt erősen rontja." },
      { k: "Hogyan lehet nevelni az ADHD-s gyermeket?", v: "Következetes, kiszámítható struktúra, rövid feladatok, azonnali visszajelzés, sok mozgás, feladatok kisebb egységekre bontása, pozitív megerősítés." },
      { k: "Mi a pozitív megerősítés szerepe ADHD-nál?", v: "Az ADHD-s gyermek büntetés helyett jutalomra reagál jobban – az elvárt viselkedést azonnali, konkrét dicsérettel megerősíteni hatékony." },

  },
  {

// ===================== STATE =====================
let currentTetelId = 1;
let currentTab = 'kartya';
let flippedCards = new Set();
let currentView = 'home'; // 'home' | 'fejezet' | 'tetel'
let currentFejezetIdx = null;

// ===================== INIT =====================
function init() {
  // Populate sidebar: Főoldal link + fejezetenként csoportosított tételek
  const sidebarList = document.getElementById('sidebarList');
  sidebarList.innerHTML = '';

  const homeItem = document.createElement('div');
  homeItem.className = 'sidebar-item home-item';
  homeItem.id = 'sidebar-home';
  homeItem.innerHTML = `<span class="num">🏠</span><span>Főoldal – fejezetek</span>`;
  homeItem.onclick = () => selectHome();
  sidebarList.appendChild(homeItem);

  fejezetek.forEach((fej, fIdx) => {
    const header = document.createElement('div');
    header.className = 'fejezet-header';
    header.id = `sidebar-fejezet-${fIdx}`;
    header.innerHTML = `<span>${fej.romaiSzam}. ${fej.nev}</span><span class="fejezet-count">${fej.tetelIds.length}</span>`;
    header.onclick = () => selectFejezet(fIdx);
    sidebarList.appendChild(header);

    fej.tetelIds.forEach(tid => {
      const t = tetelek.find(x => x.id === tid);
      if (!t) return;
      const item = document.createElement('div');
      item.className = 'sidebar-item';
      item.id = `sidebar-tetel-${t.id}`;
      item.innerHTML = `<span class="num">${t.id}.</span><span>${t.cim}</span>`;
      item.onclick = () => selectTetel(t.id);
      sidebarList.appendChild(item);
    });
  });

  // Populate select (fejezetenkénti optgroup-okkal)
  const sel = document.getElementById('tetelSelect');
  sel.innerHTML = '<option value="home">– Főoldal –</option>';
  fejezetek.forEach(fej => {
    const og = document.createElement('optgroup');
    og.label = `${fej.romaiSzam}. ${fej.nev}`;
    fej.tetelIds.forEach(tid => {
      const t = tetelek.find(x => x.id === tid);
      if (!t) return;
      const opt = document.createElement('option');
      opt.value = t.id;
      opt.textContent = `${t.id}. ${t.cim}`;
      og.appendChild(opt);
    });
    sel.appendChild(og);
  });

  updateSidebarActive();
  renderMain();
  updateStats();
}

function onSelectChange(val) {
  if (val === 'home') selectHome();
  else selectTetel(val);
}

function updateSidebarActive() {
  const homeEl = document.getElementById('sidebar-home');
  if (homeEl) homeEl.classList.toggle('active', currentView === 'home');
  fejezetek.forEach((fej, fIdx) => {
    const header = document.getElementById(`sidebar-fejezet-${fIdx}`);
    if (header) header.classList.toggle('active', currentView === 'fejezet' && currentFejezetIdx === fIdx);
    fej.tetelIds.forEach(tid => {
      const item = document.getElementById(`sidebar-tetel-${tid}`);
      if (item) item.classList.toggle('active', currentView === 'tetel' && currentTetelId === tid);
    });
  });
}

function selectHome() {
  currentView = 'home';
  currentFejezetIdx = null;
  document.getElementById('tetelSelect').value = 'home';
  document.getElementById('nezet').disabled = true;
  updateSidebarActive();
  renderMain();
  updateStats();
}

function selectFejezet(idx) {
  currentView = 'fejezet';
  currentFejezetIdx = idx;
  document.getElementById('tetelSelect').value = 'home';
  document.getElementById('nezet').disabled = true;
  updateSidebarActive();
  renderMain();
  updateStats();
}

function selectTetel(id) {
  currentView = 'tetel';
  currentTetelId = parseInt(id);
  document.getElementById('tetelSelect').value = currentTetelId;
  document.getElementById('nezet').disabled = false;
  updateSidebarActive();
  flippedCards.clear();
  renderMain();
  updateStats();
}

function updateStats() {
  const totalKartya = tetelek.reduce((s, t) => s + t.kartya.length, 0);
  const totalFogalom = tetelek.reduce((s, t) => s + t.fogalmak.length, 0);
  let context = '';

  if (currentView === 'tetel') {
    const tetel = tetelek.find(t => t.id === currentTetelId);
    if (tetel) {
      context = `Jelenlegi tétel kártyái: ${tetel.kartya.length} \u00a0|\u00a0 Jelenlegi tétel fogalmai: ${tetel.fogalmak.length} \u00a0|\u00a0 `;
    }
  } else if (currentView === 'fejezet') {
    const fej = fejezetek[currentFejezetIdx];
    if (fej) {
      const tetelLista = fej.tetelIds.map(tid => tetelek.find(t => t.id === tid)).filter(Boolean);
      const k = tetelLista.reduce((s, t) => s + t.kartya.length, 0);
      context = `Fejezet tételei: ${tetelLista.length} \u00a0|\u00a0 Fejezet kártyái: ${k} \u00a0|\u00a0 `;
    }
  }

  document.getElementById('statsBar').innerHTML = `
    Összes tétel: ${tetelek.length} \u00a0|\u00a0 
    ${context}
    Összes kártya: ${totalKartya} \u00a0|\u00a0
    Összes fogalom: ${totalFogalom}
  `;
}

// ===================== FŐOLDAL (fejezet kártyák) =====================
function renderHome() {
  let html = `
    <div class="topic-header">
      <h2>🎓 Tételsor áttekintés</h2>
      <div class="tetel-szoveg">Válassz egy fejezetet! Minden fejezetnél előbb a hozzá tartozó hivatalos tételszövegeket látod, utánuk tudsz az egyes tételek tanulókártyáira és fogalomgyűjteményére kattintani.</div>
    </div>
    <div class="fejezet-card-grid">
  `;
  fejezetek.forEach((fej, idx) => {
    const tetelLista = fej.tetelIds.map(tid => tetelek.find(t => t.id === tid)).filter(Boolean);
    const totalKartya = tetelLista.reduce((s, t) => s + t.kartya.length, 0);
    html += `
      <div class="fejezet-card" onclick="selectFejezet(${idx})">
        <div class="fejezet-card-num">${fej.romaiSzam}.</div>
        <div class="fejezet-card-nev">${fej.nev}</div>
        <div class="fejezet-card-leiras">${fej.leiras}</div>
        <div class="fejezet-card-meta">${tetelLista.length} tétel · ${totalKartya} kártya</div>
      </div>
    `;
  });
  html += '</div>';
  return html;
}

// ===================== FEJEZET ÁTTEKINTŐ (tételek a kártyák előtt) =====================
function renderFejezetOverview(idx) {
  const fej = fejezetek[idx];
  if (!fej) return '<div class="empty-state">Fejezet nem található.</div>';
  const tetelLista = fej.tetelIds.map(tid => tetelek.find(t => t.id === tid)).filter(Boolean);
  const totalKartya = tetelLista.reduce((s, t) => s + t.kartya.length, 0);
  const totalFogalom = tetelLista.reduce((s, t) => s + t.fogalmak.length, 0);

  let html = `
    <div class="breadcrumb">
      <span class="breadcrumb-link" onclick="selectHome()">🏠 Főoldal</span>
      <span class="breadcrumb-sep">›</span>
      <span>${fej.romaiSzam}. ${fej.nev}</span>
    </div>
    <div class="topic-header">
      <h2>${fej.romaiSzam}. fejezet – ${fej.nev}</h2>
      <div class="tetel-szoveg">${fej.leiras}</div>
    </div>
    <div class="fejezet-meta-bar">${tetelLista.length} tétel \u00a0|\u00a0 ${totalKartya} kártya \u00a0|\u00a0 ${totalFogalom} fogalom</div>
    <div class="fejezet-tetel-lista">
  `;

  tetelLista.forEach(t => {
    html += `
      <div class="fejezet-tetel-item" onclick="selectTetel(${t.id})">
        <div class="fejezet-tetel-top">
          <span class="fejezet-tetel-num">${t.id}. tétel</span>
          <span class="fejezet-tetel-meta">📇 ${t.kartya.length} \u00a0 📖 ${t.fogalmak.length}</span>
        </div>
        <div class="fejezet-tetel-cim">${t.cim}</div>
        <div class="fejezet-tetel-szoveg">${t.tetelSzoveg}</div>
        <div class="fejezet-tetel-cta">Tanulókártyák megnyitása →</div>
      </div>
    `;
  });

  html += '</div>';
  return html;
}

// ===================== TÉTEL RÉSZLETES NÉZET =====================
function renderMain() {
  const main = document.getElementById('mainContent');

  if (currentView === 'home') {
    main.innerHTML = renderHome();
    return;
  }
  if (currentView === 'fejezet') {
    main.innerHTML = renderFejezetOverview(currentFejezetIdx);
    return;
  }

  const tab = document.getElementById('nezet').value;
  const tetel = tetelek.find(t => t.id === currentTetelId);

  if (!tetel) { main.innerHTML = '<div class="empty-state">Válassz tételt!</div>'; return; }

  const fejIdx = fejezetek.findIndex(f => f.tetelIds.includes(tetel.id));
  const fej = fejezetek[fejIdx];

  let html = `
    <div class="breadcrumb">
      <span class="breadcrumb-link" onclick="selectHome()">🏠 Főoldal</span>
      <span class="breadcrumb-sep">›</span>
      <span class="breadcrumb-link" onclick="selectFejezet(${fejIdx})">${fej ? fej.romaiSzam + '. ' + fej.nev : ''}</span>
      <span class="breadcrumb-sep">›</span>
      <span>${tetel.id}. tétel</span>
    </div>
    <div class="topic-header">
      <h2>${tetel.id}. tétel – ${tetel.cim}</h2>
      <div class="tetel-szoveg">${tetel.tetelSzoveg}</div>
    </div>
    <div class="tabs">
      <button class="tab-btn ${tab === 'teljes' ? 'active' : ''}" onclick="switchTab('teljes')">📝 Teljes leírás</button>
      <button class="tab-btn ${tab === 'fogalom' ? 'active' : ''}" onclick="switchTab('fogalom')">📖 Fogalomgyűjtemény (${tetel.fogalmak.length})</button>
      <button class="tab-btn ${tab === 'kartya' ? 'active' : ''}" onclick="switchTab('kartya')">📇 Tanulókártyák (${tetel.kartya.length})</button>
      <button class="tab-btn ${tab === 'mindmap' ? 'active' : ''}" onclick="switchTab('mindmap')">🗺️ Mindmap</button>
    </div>
  `;

  if (tab === 'kartya') {    html += '<div class="cards-grid">';
    tetel.kartya.forEach((item, idx) => {
      const id = `card-${tetel.id}-${idx}`;
      const flipped = flippedCards.has(id) ? ' flipped' : '';
      html += `
        <div class="flashcard${flipped}" id="${id}" onclick="flipCard('${id}')">
          <div class="flashcard-inner">
            <div class="card-face card-front">
              <div class="card-num">❓ ${idx + 1}/${tetel.kartya.length}</div>
              <div class="card-question">${item.k}</div>
              <div class="card-hint">Kattints a válaszért</div>
            </div>
            <div class="card-face card-back">
              <div class="card-num">✅ ${idx + 1}/${tetel.kartya.length}</div>
              <div class="card-answer">${item.v}</div>
              <div class="card-hint">Kattints vissza</div>
            </div>
          </div>
        </div>
      `;
    });
    html += '</div>';
  } else if (tab === 'fogalom') {
    html += '<div class="fogalmak-grid">';
    tetel.fogalmak.forEach(item => {
      html += `
        <div class="fogalom-card">
          <div class="fogalom-term">${item.f}</div>
          <div class="fogalom-def">${item.m}</div>
        </div>
      `;
    });
    html += '</div>';
  } else if (tab === 'teljes') {
    html += renderTeljesLeiras(tetel);
  } else if (tab === 'mindmap') {
    html += renderMindmap(tetel.id);
  }

  main.innerHTML = html;
}

function renderTeljesLeiras(tetel) {
  if (!tetel.teljesLeiras) {
    return '<div class="empty-state">Ehhez a tételhez még nincs feltöltve teljes szöveges leírás.</div>';
  }
  const bekezdesek = tetel.teljesLeiras.split('\n\n').filter(p => p.trim().length > 0);
  let html = '<div class="teljes-leiras-card">';
  bekezdesek.forEach(p => {
    html += `<p>${p.trim()}</p>`;
  });
  html += '</div>';
  return html;
}

function switchTab(tab) {
  document.getElementById('nezet').value = tab;
  renderMain();
}

// ===================== MINDMAP RENDERER =====================
function splitLabel(text, maxLen) {
  if (text.length <= maxLen) return [text];
  const words = text.split(' ');
  const lines = [];
  let current = '';
  words.forEach(word => {
    if ((current + ' ' + word).trim().length <= maxLen) {
      current = (current + ' ' + word).trim();
    } else {
      if (current) lines.push(current);
      current = word;
    }
  });
  if (current) lines.push(current);
  return lines.slice(0, 3);
}

function drawNode(x, y, text, fillColor, textColor, isBranch, svgLines, svgNodes) {
  const lines = splitLabel(text, isBranch ? 13 : 11);
  const lineH = isBranch ? 15 : 13;
  const padX = isBranch ? 12 : 8;
  const padY = isBranch ? 10 : 7;
  const w = isBranch ? 120 : 105;
  const h = Math.max(isBranch ? 38 : 30, lines.length * lineH + padY * 2);
  const rx = isBranch ? 10 : 8;
  const fs = isBranch ? 11 : 9.5;
  const fw = isBranch ? '700' : '600';

  if (isBranch) {
    svgNodes.push(`<rect x="${x - w/2}" y="${y - h/2}" width="${w}" height="${h}" rx="${rx}" fill="${fillColor}" filter="url(#mmShadow)"/>`);
  } else {
    svgNodes.push(`<rect x="${x - w/2}" y="${y - h/2}" width="${w}" height="${h}" rx="${rx}" fill="${fillColor}22" stroke="${fillColor}" stroke-width="1.5"/>`);
  }

  lines.forEach((line, li) => {
    const yOff = (li - (lines.length - 1) / 2) * lineH;
    svgNodes.push(`<text x="${x}" y="${y + yOff}" text-anchor="middle" dominant-baseline="middle" fill="${textColor}" font-size="${fs}" font-weight="${fw}" font-family="DM Sans,sans-serif">${line}</text>`);
  });

  return { x, y, w, h };
}

function renderMindmap(tetelId) {
  const data = mindmapok[tetelId];
  if (!data) return '<div class="empty-state">Mindmap nem elérhető.</div>';

  // Use a tall canvas and vertical list layout for branches
  // Each branch gets its own row with children spread horizontally
  const branchCount = data.branches.length;

  // Layout: center top, then branches as rows below
  const W = 960;
  const rowH = 130; // height per branch row
  const H = 80 + branchCount * rowH + 40;
  const cx = W / 2;
  const cy = 55;

  const svgLineArr = [];
  const svgNodeArr = [];

  // Draw center
  const cLines = splitLabel(data.center, 18);
  const cH = Math.max(44, cLines.length * 16 + 16);
  svgNodeArr.push(`<ellipse cx="${cx}" cy="${cy}" rx="110" ry="${cH/2}" fill="${data.color}" filter="url(#mmShadow)"/>`);
  cLines.forEach((line, li) => {
    const yOff = (li - (cLines.length - 1) / 2) * 16;
    svgNodeArr.push(`<text x="${cx}" y="${cy + yOff}" text-anchor="middle" dominant-baseline="middle" fill="white" font-size="13" font-weight="700" font-family="DM Sans,sans-serif">${line}</text>`);
  });

  data.branches.forEach((branch, bi) => {
    const rowY = 80 + bi * rowH + rowH / 2;
    const branchX = 145;
    const branchY = rowY;

    // Line from center to branch
    svgLineArr.push(`<line x1="${cx}" y1="${cy + cH/2}" x2="${branchX + 60}" y2="${branchY}" stroke="${branch.color}" stroke-width="2.5" stroke-opacity="0.5"/>`);

    // Branch node
    drawNode(branchX, branchY, branch.label, branch.color, '#fff', true, svgLineArr, svgNodeArr);

    // Children spread horizontally to the right
    const childCount = branch.children.length;
    const childStartX = 290;
    const childSpacing = (W - childStartX - 60) / Math.max(childCount, 1);
    const childW = Math.min(childSpacing - 10, 130);

    branch.children.forEach((child, ci) => {
      const chx = childStartX + ci * childSpacing + childW / 2;
      const chy = branchY;

      svgLineArr.push(`<line x1="${branchX + 60}" y1="${branchY}" x2="${chx - childW/2}" y2="${chy}" stroke="${branch.color}" stroke-width="1.5" stroke-opacity="0.35" stroke-dasharray="5,3"/>`);

      const clines = splitLabel(child, 12);
      const ch = Math.max(30, clines.length * 13 + 14);
      svgNodeArr.push(`<rect x="${chx - childW/2}" y="${chy - ch/2}" width="${childW}" height="${ch}" rx="8" fill="${branch.color}20" stroke="${branch.color}" stroke-width="1.5"/>`);
      clines.forEach((line, li) => {
        const yOff = (li - (clines.length - 1) / 2) * 13;
        svgNodeArr.push(`<text x="${chx}" y="${chy + yOff}" text-anchor="middle" dominant-baseline="middle" fill="${branch.color}" font-size="9.5" font-weight="600" font-family="DM Sans,sans-serif">${line}</text>`);
      });
    });
  });

  const svg = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;">
    <defs>
      <filter id="mmShadow" x="-15%" y="-15%" width="130%" height="130%">
        <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.15)"/>
      </filter>
    </defs>
    <rect width="${W}" height="${H}" fill="#f8f7f3" rx="12"/>
    ${svgLineArr.join('\n')}
    ${svgNodeArr.join('\n')}
  </svg>`;

  return `<div class="mindmap-wrap" style="overflow-x:auto;">${svg}</div>`;
}

function flipCard(id) {
  const card = document.getElementById(id);
  if (flippedCards.has(id)) {
    flippedCards.delete(id);
    card.classList.remove('flipped');
  } else {
    flippedCards.add(id);
    card.classList.add('flipped');
  }
}
