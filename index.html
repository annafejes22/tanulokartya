<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gyógypedagógiai Asszisztens – Tanulókártyák</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap');

  :root {
    --bg: #f5f0e8;
    --card-bg: #fffdf7;
    --accent: #2d6a4f;
    --accent2: #d4845a;
    --text: #1a1a2e;
    --text-light: #5a5a72;
    --border: #d8cfc0;
    --tag-bg: #e8f4f0;
    --tag-text: #2d6a4f;
    --flip-bg: #2d3a4a;
    --flip-text: #f5f0e8;
    --shadow: 0 4px 24px rgba(45,106,79,0.10);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  header {
    background: var(--accent);
    color: #fff;
    padding: 2rem 2rem 1.5rem;
    text-align: center;
  }
  header h1 {
    font-family: 'Fraunces', serif;
    font-size: 2rem;
    font-weight: 700;
    letter-spacing: -0.5px;
    margin-bottom: 0.3rem;
  }
  header p { font-size: 0.95rem; opacity: 0.85; }

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 0.7rem;
    padding: 1.2rem 1.5rem;
    background: #fff;
    border-bottom: 1px solid var(--border);
    align-items: center;
    justify-content: center;
  }
  .controls select, .controls input {
    font-family: 'DM Sans', sans-serif;
    font-size: 0.92rem;
    padding: 0.5rem 0.9rem;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    background: var(--card-bg);
    color: var(--text);
    outline: none;
    cursor: pointer;
  }
  .controls select:focus, .controls input:focus {
    border-color: var(--accent);
  }
  .controls label { font-size: 0.88rem; color: var(--text-light); font-weight: 500; }

  .stats-bar {
    background: var(--tag-bg);
    border-bottom: 1px solid var(--border);
    padding: 0.6rem 1.5rem;
    display: flex;
    gap: 1.5rem;
    justify-content: center;
    flex-wrap: wrap;
    font-size: 0.85rem;
    color: var(--accent);
    font-weight: 600;
  }

  .layout {
    display: flex;
    min-height: calc(100vh - 200px);
  }

  .sidebar {
    width: 280px;
    min-width: 220px;
    background: #fff;
    border-right: 1px solid var(--border);
    overflow-y: auto;
    max-height: calc(100vh - 200px);
    position: sticky;
    top: 0;
  }
  .sidebar h2 {
    font-family: 'Fraunces', serif;
    font-size: 1rem;
    padding: 1rem 1rem 0.5rem;
    color: var(--text-light);
    border-bottom: 1px solid var(--border);
    letter-spacing: 0.05em;
    text-transform: uppercase;
    font-size: 0.78rem;
  }
  .sidebar-item {
    padding: 0.65rem 1rem;
    cursor: pointer;
    border-bottom: 1px solid #f0ece4;
    font-size: 0.85rem;
    line-height: 1.4;
    transition: background 0.15s;
    display: flex;
    align-items: flex-start;
    gap: 0.5rem;
  }
  .sidebar-item:hover { background: var(--tag-bg); }
  .sidebar-item.active { background: var(--accent); color: #fff; font-weight: 600; }
  .sidebar-item .num {
    font-size: 0.75rem;
    min-width: 22px;
    font-weight: 700;
    opacity: 0.7;
    margin-top: 1px;
  }

  .home-item {
    font-weight: 700;
    color: var(--accent);
  }

  .fejezet-header {
    padding: 0.7rem 1rem 0.5rem;
    cursor: pointer;
    background: var(--tag-bg);
    border-bottom: 1px solid var(--border);
    border-top: 1px solid var(--border);
    font-family: 'Fraunces', serif;
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
    transition: background 0.15s;
  }
  .fejezet-header:hover { background: #ddeee6; }
  .fejezet-header.active { background: var(--accent); color: #fff; }
  .fejezet-header .fejezet-count {
    font-size: 0.7rem;
    font-weight: 600;
    background: rgba(45,106,79,0.15);
    border-radius: 10px;
    padding: 0.1rem 0.5rem;
    flex-shrink: 0;
  }
  .fejezet-header.active .fejezet-count { background: rgba(255,255,255,0.25); }

  /* BREADCRUMB */
  .breadcrumb {
    font-size: 0.82rem;
    color: var(--text-light);
    margin-bottom: 1rem;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.4rem;
  }
  .breadcrumb-link {
    cursor: pointer;
    color: var(--accent);
    font-weight: 600;
  }
  .breadcrumb-link:hover { text-decoration: underline; }
  .breadcrumb-sep { opacity: 0.5; }

  /* FEJEZET ÁTTEKINTŐ LISTA (tételek a kártyák előtt) */
  .fejezet-meta-bar {
    font-size: 0.85rem;
    color: var(--accent);
    font-weight: 600;
    margin-bottom: 1.2rem;
  }
  .fejezet-tetel-lista {
    display: flex;
    flex-direction: column;
    gap: 0.9rem;
  }
  .fejezet-tetel-item {
    background: var(--card-bg);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 1rem 1.2rem;
    box-shadow: var(--shadow);
    cursor: pointer;
    transition: border-color 0.15s, transform 0.15s;
  }
  .fejezet-tetel-item:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
  }
  .fejezet-tetel-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 0.3rem;
  }
  .fejezet-tetel-num {
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--accent2);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .fejezet-tetel-meta {
    font-size: 0.78rem;
    color: var(--text-light);
  }
  .fejezet-tetel-cim {
    font-family: 'Fraunces', serif;
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 0.4rem;
  }
  .fejezet-tetel-szoveg {
    font-size: 0.88rem;
    line-height: 1.55;
    color: var(--text-light);
    font-style: italic;
    margin-bottom: 0.5rem;
  }
  .fejezet-tetel-cta {
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--accent);
  }

  /* FŐOLDAL - FEJEZET KÁRTYÁK */
  .fejezet-card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 1.2rem;
  }
  .fejezet-card {
    background: var(--card-bg);
    border: 1.5px solid var(--border);
    border-radius: 14px;
    padding: 1.4rem 1.3rem;
    box-shadow: var(--shadow);
    cursor: pointer;
    transition: border-color 0.15s, transform 0.15s;
  }
  .fejezet-card:hover {
    border-color: var(--accent);
    transform: translateY(-3px);
  }
  .fejezet-card-num {
    font-family: 'Fraunces', serif;
    font-size: 1.8rem;
    font-weight: 700;
    color: var(--accent2);
    opacity: 0.6;
    margin-bottom: 0.3rem;
  }
  .fejezet-card-nev {
    font-family: 'Fraunces', serif;
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 0.5rem;
  }
  .fejezet-card-leiras {
    font-size: 0.86rem;
    line-height: 1.5;
    color: var(--text-light);
    margin-bottom: 0.8rem;
  }
  .fejezet-card-meta {
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--accent);
  }

  .main {
    flex: 1;
    padding: 1.5rem;
    overflow-y: auto;
  }

  .topic-header {
    margin-bottom: 1.5rem;
    padding-bottom: 1rem;
    border-bottom: 2px solid var(--border);
  }
  .topic-header h2 {
    font-family: 'Fraunces', serif;
    font-size: 1.4rem;
    color: var(--accent);
    margin-bottom: 0.3rem;
  }
  .topic-header .tetel-szoveg {
    font-size: 0.92rem;
    color: var(--text-light);
    font-style: italic;
  }

  /* TABS */
  .tabs {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 1.5rem;
    border-bottom: 2px solid var(--border);
  }
  .tab-btn {
    padding: 0.55rem 1.2rem;
    border: none;
    background: none;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.92rem;
    color: var(--text-light);
    cursor: pointer;
    border-bottom: 3px solid transparent;
    margin-bottom: -2px;
    font-weight: 500;
    transition: color 0.15s;
  }
  .tab-btn.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
    font-weight: 700;
  }

  /* FLASHCARDS */
  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 1.2rem;
  }

  .flashcard {
    perspective: 1000px;
    height: 200px;
    cursor: pointer;
  }
  .flashcard-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transition: transform 0.55s cubic-bezier(.4,2,.6,1);
    transform-style: preserve-3d;
  }
  .flashcard.flipped .flashcard-inner { transform: rotateY(180deg); }

  .card-face {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    border-radius: 14px;
    padding: 1.2rem 1.3rem;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-shadow: var(--shadow);
    border: 1.5px solid var(--border);
  }
  .card-front {
    background: var(--card-bg);
  }
  .card-back {
    background: var(--flip-bg);
    color: var(--flip-text);
    transform: rotateY(180deg);
    border-color: transparent;
  }

  .card-num {
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    opacity: 0.7;
  }
  .card-back .card-num { color: rgba(245,240,232,0.5); }

  .card-question {
    font-size: 0.95rem;
    font-weight: 600;
    line-height: 1.45;
    flex: 1;
    display: flex;
    align-items: center;
    margin: 0.6rem 0;
  }
  .card-answer {
    font-size: 0.88rem;
    line-height: 1.55;
    flex: 1;
    display: flex;
    align-items: center;
    margin: 0.4rem 0;
    opacity: 0.92;
  }

  .card-hint {
    font-size: 0.72rem;
    color: var(--text-light);
    display: flex;
    align-items: center;
    gap: 0.3rem;
  }
  .card-hint::before { content: '↕'; font-size: 0.9rem; }
  .card-back .card-hint { color: rgba(245,240,232,0.5); }
  .card-back .card-hint::before { content: '↕'; }

  /* TELJES LEÍRÁS (folyamatos, szóban elmondható felelet) */
  .teljes-leiras-card {
    background: var(--card-bg);
    border: 1.5px solid var(--border);
    border-radius: 14px;
    padding: 1.6rem 1.8rem;
    box-shadow: var(--shadow);
    max-width: 780px;
  }
  .teljes-leiras-card p {
    font-size: 0.96rem;
    line-height: 1.75;
    color: var(--text);
    margin-bottom: 1.1rem;
  }
  .teljes-leiras-card p:last-child { margin-bottom: 0; }
  .teljes-leiras-card p:first-of-type::first-letter {
    font-family: 'Fraunces', serif;
    font-size: 1.7rem;
    font-weight: 700;
    color: var(--accent);
  }

  /* FOGALOMGYŰJTEMÉNY */
  .fogalmak-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 1rem;
  }
  .fogalom-card {
    background: var(--card-bg);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 1.1rem 1.2rem;
    box-shadow: var(--shadow);
  }
  .fogalom-term {
    font-family: 'Fraunces', serif;
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 0.5rem;
  }
  .fogalom-def {
    font-size: 0.87rem;
    line-height: 1.6;
    color: var(--text);
  }
  .fogalom-def em {
    color: var(--accent2);
    font-style: normal;
    font-weight: 600;
  }

  /* MINDMAP */
  .mindmap-wrap {
    width: 100%;
    overflow-x: auto;
    overflow-y: auto;
    background: #fff;
    border-radius: 14px;
    border: 1.5px solid var(--border);
    box-shadow: var(--shadow);
    padding: 1rem;
    min-height: 400px;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    -webkit-overflow-scrolling: touch;
  }
  .mindmap-wrap svg {
    min-width: 700px;
    height: auto;
  }
  .mm-legend {
    margin-top: 1rem;
    display: flex;
    flex-wrap: wrap;
    gap: 0.6rem;
    justify-content: center;
  }
  .mm-legend-item {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.8rem;
    color: var(--text-light);
  }
  .mm-legend-dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  /* TABLET */
  @media (max-width: 1024px) {
    .sidebar { width: 220px; min-width: 180px; }
    .cards-grid { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
    .fogalmak-grid { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
  }

  /* MOBILE */
  @media (max-width: 700px) {
    header { padding: 1.2rem 1rem 1rem; }
    header h1 { font-size: 1.3rem; }
    header p { font-size: 0.82rem; }

    .controls {
      padding: 0.8rem 1rem;
      gap: 0.5rem;
      flex-direction: column;
      align-items: stretch;
    }
    .controls label { font-size: 0.82rem; }
    .controls select {
      font-size: 0.88rem;
      padding: 0.55rem 0.7rem;
      width: 100%;
    }

    .stats-bar {
      font-size: 0.75rem;
      padding: 0.5rem 0.8rem;
      gap: 0.5rem;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .layout {
      flex-direction: column;
      min-height: unset;
    }

    .sidebar {
      width: 100%;
      min-width: unset;
      max-height: 160px;
      position: static;
      border-right: none;
      border-bottom: 2px solid var(--border);
      overflow-y: auto;
      overflow-x: hidden;
    }
    .sidebar h2 { padding: 0.6rem 0.8rem 0.4rem; }
    .sidebar-item {
      padding: 0.5rem 0.8rem;
      font-size: 0.8rem;
    }
    .fejezet-header { padding: 0.55rem 0.8rem 0.4rem; font-size: 0.78rem; }
    .fejezet-tetel-item { padding: 0.8rem 0.9rem; }
    .fejezet-tetel-cim { font-size: 0.95rem; }
    .fejezet-tetel-szoveg { font-size: 0.82rem; }
    .fejezet-card-grid { grid-template-columns: 1fr; }

    .main {
      padding: 1rem 0.8rem;
    }

    .topic-header h2 { font-size: 1.1rem; }
    .topic-header .tetel-szoveg { font-size: 0.82rem; }

    .tabs {
      gap: 0.2rem;
      overflow-x: auto;
      padding-bottom: 2px;
      flex-wrap: nowrap;
    }
    .tab-btn {
      font-size: 0.78rem;
      padding: 0.45rem 0.7rem;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .cards-grid {
      grid-template-columns: 1fr;
      gap: 0.9rem;
    }
    .flashcard { height: 185px; }
    .card-question { font-size: 0.88rem; }
    .card-answer { font-size: 0.82rem; }
    .card-num { font-size: 0.68rem; }

    .fogalmak-grid {
      grid-template-columns: 1fr;
      gap: 0.8rem;
    }
    .fogalom-term { font-size: 0.98rem; }
    .fogalom-def { font-size: 0.82rem; }

    .mindmap-wrap {
      padding: 0.5rem;
      min-height: 320px;
    }
    .mm-legend {
      gap: 0.4rem;
    }
    .mm-legend-item { font-size: 0.72rem; }
  }

  /* SMALL PHONES */
  @media (max-width: 380px) {
    header h1 { font-size: 1.1rem; }
    .tab-btn { font-size: 0.72rem; padding: 0.4rem 0.55rem; }
    .flashcard { height: 195px; }
    .card-question { font-size: 0.83rem; }
    .card-answer { font-size: 0.78rem; }
  }

  .empty-state {
    text-align: center;
    padding: 3rem;
    color: var(--text-light);
    font-size: 1rem;
  }

  /* PROGRESS */
  .progress-wrap { margin-bottom: 1rem; }
  .progress-bar-bg {
    background: var(--border);
    border-radius: 8px;
    height: 8px;
    overflow: hidden;
  }
  .progress-bar-fill {
    background: var(--accent);
    height: 100%;
    border-radius: 8px;
    transition: width 0.4s;
  }
  .progress-label {
    font-size: 0.8rem;
    color: var(--text-light);
    margin-bottom: 0.3rem;
  }
</style>
</head>
<body>

<header>
  <h1>🎓 Gyógypedagógiai Asszisztens</h1>
  <p>Képesítő vizsga – Szóbeli tételsor tanulókártyák &amp; fogalomgyűjtemény</p>
</header>

<div class="controls">
  <label>Tétel:</label>
  <select id="tetelSelect" onchange="onSelectChange(this.value)">
    <option value="home">– Főoldal –</option>
  </select>
  <label>Nézet:</label>
  <select id="nezet" onchange="renderMain()">
    <option value="teljes">Teljes leírás</option>
    <option value="fogalom">Fogalomgyűjtemény</option>
    <option value="kartya">Tanulókártyák</option>
    <option value="mindmap">Mindmap</option>
  </select>
</div>

<div class="stats-bar" id="statsBar">
  Összes tétel: 26 &nbsp;|&nbsp; Kártyák: – &nbsp;|&nbsp; Fogalmak: –
</div>

<div class="layout">
  <nav class="sidebar">
    <h2>Fejezetek &amp; tételek</h2>
    <div id="sidebarList"></div>
  </nav>
  <main class="main" id="mainContent"></main>
</div>

<script>
// ===================== ADATOK =====================

const tetelek = [
  {
    id: 1,
    cim: "Pedagógia fogalma, nevelés módszerei",
    tetelSzoveg: "Ismertesse a pedagógia fogalmát, célját, tárgyát, feladatát, sorolja fel a pedagógia területeit! Határozza meg a nevelés fogalmát, mutassa be a nevelés módszereit!",
    teljesLeiras: `A pedagógia kettős értelmű fogalom: egyrészt a nevelés tudománya, vagyis a neveléstudomány, másrészt maga a nevelési gyakorlat. Tárgya a nevelés, vagyis az a szándékos, tervszerű és intézményes folyamat, amelynek során a felnőtt generáció átadja tudását, értékeit és normáit a fiatalabb generációnak. Célja a gyermek sokoldalú, harmonikus személyiségfejlesztése – testi, szellemi, erkölcsi és esztétikai területen egyaránt.

A pedagógia feladatai négy pontban foglalhatók össze: leírja a nevelési folyamatokat, feltárja azok törvényszerűségeit, meghatározza a nevelés céljait és elveit, valamint módszereket és eszközöket dolgoz ki ezek megvalósításához. A pedagógiának több területe van: ide tartozik a didaktika, vagyis az oktatáselmélet, a neveléselmélet, az iskolapedagógia, a gyógypedagógia, az óvodapedagógia, a felsőoktatás-pedagógia és az összehasonlító pedagógia is.

A nevelés maga szándékos, céltudatos és tervszerű tevékenység, amellyel a pedagógus a tanuló személyiségét formálja: értékeket, normákat és viselkedési mintákat közvetít. Fontos megkülönböztetni a formális nevelést, amely intézményes keretek között, iskolában vagy óvodában zajlik, az informális neveléstől, amely nem intézményes, hanem életszerű helyzetekben, például a famíliában vagy a baráti körben valósul meg. Az oktatás és a nevelés szorosan összefonódik: az oktatás az ismeretek átadása, a nevelés a személyiség formálása, de a kettő elválaszthatatlan, hiszen minden jó oktatás nevel is, és minden nevelés egyúttal oktat is.

A nevelés módszerei azok az eljárások és eszközök, amelyekkel a nevelő a kitűzött nevelési célt el kívánja érni. A meggyőzés módszerénél a nevelő szóban, példával vagy érveléssel hat a gyermek gondolkodására és érzelmeire, hogy benne helyes meggyőződés alakuljon ki – ide tartozik a magyarázat, az elbeszélés és a vita is. A szoktatás ismétléssel és gyakorlással alakítja ki a kívánt szokásokat és magatartásformákat, például a köszönést vagy a rendszeretetet. A jutalmazás megerősíti a helyes viselkedést és növeli a motivációt, lehet szóbeli dicséret, jegy vagy kitüntetés, de mindig arányosnak kell lennie a teljesítményhez. A büntetést csak akkor alkalmazzuk, ha a helytelen viselkedés más módszerrel nem változtatható meg, és soha nem lehet testi vagy megalázó jellegű, mindig következetesnek és igazságosnak kell lennie. Nagyon fontos eszköz a személyes példamutatás is, hiszen a gyermekek elsősorban utánzással tanulnak, így a pedagógus saját viselkedése az egyik legerősebb nevelő hatás. Végül a követelés módszerénél a nevelő egyértelmű, teljesíthető és életkornak megfelelő elvárásokat fogalmaz meg, amely akkor hatékony, ha következetes és érthető.

Összefoglalva tehát a pedagógia a nevelés elméletét és gyakorlatát egyaránt magában foglaló tudomány, amely különböző területekre tagolódik, a nevelés pedig egy tudatosan irányított, sokféle módszerrel megvalósuló folyamat, amelynek célja a gyermek harmonikus személyiségfejlődése.`,
    kartya: [

      { k: "Milyen területei vannak a pedagógiának?", v: "Didaktika (oktatáselmélet), neveléselmélet, iskolapedagógia, gyógypedagógia, óvodapedagógia, felsőoktatás-pedagógia, összehasonlító pedagógia." },

      { k: "Milyen feladatai vannak a pedagógiának?", v: "1. Leírja a nevelési folyamatokat. 2. Feltárja törvényszerűségeiket. 3. Meghatározza a nevelés céljait és elveit. 4. Módszereket és eszközöket dolgoz ki." },

    teljesLeiras: `A szocializáció az a hosszú, egész életen át tartó folyamat, amelynek során az egyén megtanulja a társadalom normáit, értékeit, szerepeit és viselkedési mintáit, és ezáltal fokozatosan beilleszkedik a közösségbe. A szocializáció legfontosabb színterei a família, az óvoda, az iskola, a kortárscsoport, a média és a vallási közösségek, később pedig a munkahely is ide tartozik.

A família a legfontosabb szocializációs színtér, hiszen itt alakulnak ki a gyermek első és legerősebb érzelmi kötődései. A família adja az alapértékeket, a szokásokat és a kommunikációs mintákat, és alapvetően meghatározza a kialakuló személyiséget. Ezt nevezzük primer szocializációnak: csecsemőkortól iskoláskorig elsősorban a família hatása érvényesül, a gyermek itt sajátítja el az érzelmi biztonság alapjait, és itt történik a szerepátörökítés is, vagyis hogy a gyermek megfigyeli a szülők viselkedését és szerepeit, és ezeket mintaként veszi át. A nevelési stílus döntő hatású: a demokratikus nevelés, amely önállóságot és határokat egyaránt biztosít, egészséges szocializációhoz vezet, az autoritárius nevelés félelmet és feltétlen engedelmességet, az elhanyagoló nevelés pedig bizonytalanságot és alacsony önértékelést eredményezhet.

Iskoláskortól kezdve a szekunder szocializáció kerül előtérbe: ekkor az intézmények, elsősorban az óvoda és az iskola, valamint a kortársak szerepe nő meg. Az óvoda segíti az iskolaérettség kialakulását, fejleszti a figyelmet, a szociális készségeket, az önkiszolgálást és a szabálykövető magatartást, amelyek mind az iskolai tanulás alapjai. Az iskola nemcsak tanít, hanem úgynevezett latens, vagyis rejtett funkciókat is betölt: közvetetten normákat, hierarchiát és teljesítményorientációt is közvetít, anélkül, hogy ezt kimondaná. Az inkluzív iskola különösen fontos szerepet játszik abban, hogy a gyerekek megtanulják az elfogadást, az empátiát és a sokféleség értékét, hiszen befogadja a különböző képességű tanulókat is.

Serdülőkorban a kortárscsoport szerepe különösen felerősödik: a kortársak visszajelzései és normái erősen hatnak az identitás alakulására, és a gyermek itt tanulja meg az egyenrangú kapcsolatok kezelését. A média is fontos szocializációs tényező, hiszen értékeket, szerepmodelleket és viselkedési mintákat közvetít, pozitív és negatív irányban egyaránt, ezért kritikus médiafogyasztásra van szükség.

  {

    cim: "Oktatás fogalma, tanítás-tanulás folyamata",
    tetelSzoveg: "Ismertesse az oktatás fogalmát, célját, valamint a tanítás-tanulás folyamatát!",
    teljesLeiras: `Az oktatás tudatos, tervszerű és intézményes folyamat, amelynek során a pedagógus ismereteket, készségeket és képességeket közvetít a tanulóknak. Célja a tudás átadása, a képességek fejlesztése, a személyiség alakítása és a társadalomba való beilleszkedés elősegítése. Fontos alapelv, hogy az oktatás soha nem értéksemleges: minden tanítási tartalom egyben értékeket és normákat is közvetít, ezért oktatás és nevelés a gyakorlatban elválaszthatatlan egymástól.

A tanítás-tanulás folyamata a tanár és a tanuló közötti kölcsönös, kétirányú folyamat: a tanár szervezi és irányítja a tanulást, a tanuló pedig aktívan feldolgozza az új ismereteket. Az oktatási folyamat jellemző fázisai a motiválás, a célkitűzés, az új anyag feldolgozása, a rögzítés és megszilárdítás, az alkalmazás, végül az értékelés és ellenőrzés. Ezt egy másik szemszögből úgy is leírhatjuk, mint az érzékelés, a megértés, az elvonatkoztatás és az alkalmazás egymásra épülő szakaszait, ami Herbart klasszikus fokozatrendszerének modern változata.

A motiváció kulcsfontosságú: a belső motiváció, vagyis amikor a tanulót valódi érdeklődés hajtja, sokkal erősebb és tartósabb, mint a külső motiváció, például a jó jegy. Az aktív tanulás során a tanuló nem passzívan fogad be ismereteket, hanem maga fedezi fel az összefüggéseket, kérdez, alkot és kipróbál dolgokat, ami mélyebb és tartósabb tudást eredményez. Mivel az ismeretek egymásra épülnek, fontos a tananyag logikai sorrendje is: az új anyag csak akkor érthető igazán, ha az előző már megszilárdult, ezért célszerű a spirálisan haladó, egymásra épülő tananyag-feldolgozás.

A visszacsatolás nélkülözhetetlen eleme a folyamatnak, hiszen e nélkül sem a tanár, sem a tanuló nem tudja, merre tart: az ellenőrzés segít azonosítani a hiányosságokat és korrigálni azokat. Itt érdemes megkülönböztetni a formáló értékelést, amely menet közben, a fejlődést segítve zajlik, az összegző értékeléstől, amely a folyamat végén, lezárásként történik, például vizsga vagy érdemjegy formájában.

A hatékony oktatás figyelembe veszi a tanulók eltérő tempóját, stílusát és előismereteit, ezt nevezzük differenciálásnak, valamint Vigotszkij legközelebbi fejlődési zóna fogalmára épít, vagyis arra a területre, ahol a gyermek felnőtt vagy okosabb társ segítségével már képes teljesíteni, bár önállóan még nem menne neki. Sajátos nevelési igényű tanulóknál ezt egyéni fejlesztési terv rögzíti, amely pontosan meghatározza a fejlesztési célokat, a módszereket és a haladás ütemét. Összességében tehát az oktatás egy célzott, többlépcsős folyamat, amelyben a motiváció, a fokozatosság, a visszacsatolás és az egyéni különbségek figyelembevétele együtt biztosítja a hatékony tanulást.`,
    kartya: [
      { k: "Mi az oktatás?", v: "Az oktatás tudatos, tervszerű, intézményes folyamat, amelynek során a pedagógus ismereteket, készségeket és képességeket közvetít a tanulóknak." },

      { k: "Mi a tanítás-tanulás folyamata?", v: "A tanár és a tanuló közötti kölcsönös, kétirányú folyamat: a tanár szervezi, irányítja a tanulást; a tanuló aktívan feldolgozza az új ismereteket." },
      { k: "Melyek az oktatási folyamat fázisai?", v: "1. Motiválás. 2. Célkitűzés. 3. Az új anyag feldolgozása. 4. Rögzítés, megszilárdítás. 5. Alkalmazás. 6. Értékelés, ellenőrzés." },

      { k: "Mi a különbség tudás és készség között?", v: "A tudás elméleti ismeret (pl. mi a fotoszintézis?). A készség begyakorolt, automatikus cselekvés (pl. olvasás, kerékpározás)." },

      { k: "Mi a differenciálás az oktatásban?", v: "A tanár figyelembe veszi a tanulók eltérő tempóját, stílusát, előismereteit, és ehhez igazítja a feladatokat és módszereit." },
      { k: "Mi az egyéni fejlesztési terv célja?", v: "SNI-s vagy más sajátos igényű tanulóknál az egyéni fejlesztési terv pontosan meghatározza a fejlesztési célokat, módszereket és a haladás ütemét." },
      { k: "Mi a Vygotsky-féle legközelebbi fejlődési zóna?", v: "Az a terület, ahol a gyerek még nem tud önállóan teljesíteni, de felnőtt vagy okosabb társ segítségével igen. Erre épít a hatékony oktatás." },
      { k: "Mi a formáló és összegző értékelés különbsége?", v: "Formáló értékelés: menet közben, a fejlődést segíti. Összegző értékelés: a végén, lezárja a folyamatot (pl. vizsga, jegy)." },

      { k: "Milyen tanulási stílusok léteznek?", v: "Vizuális (látás), auditív (hallás), kinesztetikus (cselekvés). Hatékony oktatás többféle csatornán éri el a tanulót." },
      { k: "Mi a túlterhelés jele és hogyan előzhető meg?", v: "Jele: fáradtság, figyelmetlenség, csökkenő teljesítmény. Megelőzés: arányos feladatmennyiség, szünetek, változatos módszerek." },
      { k: "Mi az oktatás és nevelés egységének elve?", v: "Az oktatás soha nem értéksemleges: minden tanítási tartalom egyben értékeket, normákat is közvetít. Oktatás és nevelés elválaszthatatlan." },

    teljesLeiras: `Az oktatási módszer az a tudatos eljárás, amellyel a pedagógus és a tanuló közösen eléri a kitűzött oktatási célokat. A leggyakoribb módszerek közé tartozik a magyarázat, a szemléltetés, a gyakorlás, a megbeszélés, a vita, a projektmódszer, a felfedező és heurisztikus tanulás, a kooperatív módszerek, a szimuláció és az előadás.

A szemléltetés képek, tárgyak, modellek, filmek vagy kísérletek bemutatásával teszi érzékletessé az ismeretet – ahogy mondani szokták, egy kép ezer szót ér. A megbeszélés irányított párbeszéd a tanár és a tanulók között, amelyben a tanár kérdésekkel vezeti a gondolkodást. A heurisztikus módszernél a tanár szintén kérdésekkel rávezeti a tanulót az önálló felfedezésre, így a tanuló maga jut el a következtetésre, ami mélyebb megértést eredményez. A projektmódszer során a tanulók egy valódi, komplex problémát oldanak meg önállóan vagy csoportban, ami fejleszti a kreativitást, a tervezést és a valós problémamegoldó képességet. A szimuláció valóságos szituációkat imitál tanítási céllal, például szerepjáték vagy szituációs gyakorlat formájában, ami különösen hasznos a gyógypedagógiai asszisztensi munkában is.

Az oktatási módszer megválasztásának fontos szempontjai a tanulók életkora, a tananyag jellege, a rendelkezésre álló idő és eszközök, a csoport összetétele és a didaktikai cél. Nem minden módszer illik minden tartalomhoz: egy kísérlet jól illik a természettudományos tárgyakhoz, egy vita pedig az erkölcsi kérdésekhez, vagyis a módszert mindig a tartalomhoz kell igazítani.

Az oktatás munkaformái a frontális, az egyéni, a páros és a csoportos munka, amelyeket a hatékony pedagógus rendszerint kombinál egy-egy órán belül. A frontális munkánál az egész osztály egyszerre, azonos tempóban halad, ez gyors az ismeretátadásban, de nem veszi figyelembe az egyéni különbségeket – akkor érdemes választani, ha sok információt kell gyorsan átadni, vagy egy teljesen új témát vezetünk be. Az egyéni munka önállóságra nevel és jól differenciálható, de elszigetelheti a tanulót, és nem fejleszti annyira a szociális készségeket. A páros munka fejleszti a kommunikációt és az együttműködést, a csoportmunka pedig a szociális készségeket, a munkamegosztást, a felelősségérzetet és a konfliktusmegoldást – ez utóbbi valósítja meg a kooperatív tanulást, amelynek alapelve a pozitív egymásrautaltság, az egyéni felelősség, a közvetlen interakció és a szociális készségek fejlesztése.

Az oktatás szervezeti kerete jellemzően a tanítási óra, de ide tartozhat a kirándulás, a szakkör, a tanulmányi séta vagy a projekthét is. A tanítási óráknak több típusa van: új ismeretet feldolgozó óra, gyakorló óra, ismétlő-rendszerező óra, ellenőrző óra és vegyes típusú óra. A házi feladat szerepe az ismeretek megszilárdítása és a tanórák közötti kapcsolat biztosítása, amely fejleszti az önállóságot, de csak mértékkel alkalmazva, hogy ne okozzon túlterhelést.`,

  {
    id: 5,
    cim: "Sajátos nevelési igény, inklúzió, integráció, szegregáció",
    tetelSzoveg: "Ismertesse a sajátos nevelési igény fogalmát, területeit! Értelmezze az inklúzió, integráció, szegregáció fogalmakat! Mutassa be a gyógypedagógiai segítő munkatárs SNI-s gyermekkel, tanulóval kapcsolatos feladatait!",
    teljesLeiras: `A sajátos nevelési igény, röviden SNI, olyan állapot, amelynek következtében a gyermek a szokásosnál nagyobb mértékű és speciálisabb nevelési, oktatási és fejlesztési ellátást igényel. Az SNI fő kategóriái az érzékszervi fogyatékosság, tehát a látás- és hallássérülés, az értelmi akadályozottság, a mozgáskorlátozottság, az autizmus spektrumzavar, valamint az egyéb pszichés fejlődési zavarok, mint a diszlexia vagy az ADHD. Ettől meg kell különböztetni a BTMN fogalmát, vagyis a beilleszkedési, tanulási és magatartási nehézséget, amely nem fogyatékosság, de speciális pedagógiai segítséget igényel. Mindkét csoport a különleges bánásmódot igénylő tanulók közé tartozik, amelybe a kiemelkedően tehetséges tanulók is beletartoznak.

Az SNI tényét a Szakértői Bizottság állapítja meg, és tesz javaslatot az ellátás formájára. Itt válik élessé a három alapfogalom megkülönböztetése. Az integráció azt jelenti, hogy az SNI-s tanulókat a nem SNI-s tanulókkal közös csoportban nevelik: a tanulók fizikailag egy helyen vannak, de a rendszer önmagában nem feltétlenül változik a gyermek köré. Az inklúzió ezen túlmutató szemlélet: nemcsak fizikailag, hanem tartalmilag is befogadja a közösség az SNI-s tanulót, vagyis a rendszer alakul a gyermek szükségleteihez, és mindenki egyenrangú tagja marad a csoportnak. A szegregáció esetén az SNI-s tanulókat külön, speciális intézményben nevelik – ez önmagában nem értékítélet, súlyosabb fogyatékosság esetén ugyanis valóban szükséges és indokolt megoldás lehet, hiszen ott speciálisan képzett szakemberek dolgoznak.

A gyógypedagógiai segítő munkatárs számos területen nyújt segítséget az SNI-s gyermeknek: egyéni segítségnyújtást ad az órákon, támogatja a higiénés szokásokat és az önkiszolgálás fejlesztését, és szorosan együttműködik a gyógypedagógussal, a famíliával és más szakemberekkel. Munkáját mindig a gyógypedagógus irányítása alatt végzi: önállóan nem hozhat szakmai döntéseket, nem diagnosztizál és nem ír fejlesztési tervet – ezt nevezzük kompetenciahatárnak, amelynek tiszteletben tartása alapvető szakmai elvárás. Dolgozhat bölcsődében, integrált óvodában vagy iskolában, speciális intézményben, gyermekotthonban, illetve felnőtt fogyatékossággal élők ellátásában is.

Munkájának alapelvei közé tartozik az empátia, a türelem, a következetesség, a diszkréció, a gyermek méltóságának tisztelete és a szakmai alázat. Az SNI-s gyermekkel való kommunikáció során türelmesen, egyértelműen, rövid mondatokban és sok visszajelzéssel kell eljárni, hiszen az érzelmi biztonság és a bizalom megteremtése alapvető feltétele a fejlődésnek. Az adaptáció, vagyis a tananyag, a módszerek és az értékelés módosítása a tanuló szükségleteihez, például hosszabb feladatmegoldási idő vagy speciális segédeszközök biztosítása, szintén a mindennapi munka része.`,
    kartya: [
      { k: "Mi a sajátos nevelési igény (SNI) fogalma?", v: "Az SNI olyan állapot, amelynek következtében a gyermek szokásosnál nagyobb mértékű és speciálisabb nevelési, oktatási, fejlesztési ellátást igényel." },
      { k: "Milyen SNI-kategóriák léteznek?", v: "1. Érzékszervi fogyatékosság (látás, hallás). 2. Értelmi akadályozottság. 3. Mozgáskorlátozottság. 4. Autizmus spektrum zavar. 5. Egyéb pszichés fejlődési zavar (diszlexia, ADHD stb.)." },
      { k: "Mi a különleges bánásmód fogalma?", v: "A különleges bánásmód azokat a tanulókat foglalja magában, akik sajátos nevelési igényük, kiemelkedő tehetségük vagy beilleszkedési nehézségeik miatt egyéni bánásmódot igényelnek." },
      { k: "Mi a BTMN fogalma?", v: "Beilleszkedési, Tanulási és Magatartási Nehézség – olyan állapot, amely nem fogyatékosság, de speciális pedagógiai segítséget igényel." },
      { k: "Mi az integráció a közoktatásban?", v: "Az SNI-s tanulókat a nem SNI-s tanulókkal közös, általános iskolai vagy óvodai csoportban nevelik. A tanulók fizikailag egy helyen vannak, de a módszerek lehetnek eltérők." },
      { k: "Mi az inklúzió?", v: "Az integráción túlmutató szemlélet: nemcsak fizikailag, hanem tartalmilag is befogadja a közösség az SNI-s tanulót. Mindenki egyenrangú tagja a közösségnek." },
      { k: "Mi a szegregáció?", v: "Az SNI-s tanulókat külön, speciális intézményben nevelik. Önmagában nem értékítélet – súlyos fogyatékosság esetén szükséges lehet." },
      { k: "Mi a különbség integráció és inklúzió között?", v: "Integráció: a gyerek 'belekerül' a csoportba, de a rendszer nem változik köré. Inklúzió: a rendszer alakul a gyerek szükségleteihez." },
      { k: "Milyen feladatai vannak a gyógypedagógiai segítő munkatársnak SNI-s gyermekkel?", v: "Egyéni segítségnyújtás az órákon, higiénés szokások támogatása, önkiszolgálás fejlesztése, együttműködés a gyógypedagógussal, a família és más szakemberekkel." },
      { k: "Mi az egyéni fejlesztési terv?", v: "Az SNI-s tanuló számára készített személyre szabott terv, amely meghatározza a fejlesztési célokat, módszereket, az értékelés módját és a fejlesztés ütemét." },
      { k: "Ki dönt az SNI megállapításáról?", v: "A Szakértői Bizottság (EGYMI – Egységes Gyógypedagógiai Módszertani Intézmény) állapítja meg az SNI-t és tesz javaslatot az ellátásra." },
      { k: "Hol dolgozhat a gyógypedagógiai asszisztens?", v: "Bölcsődében, integrált óvodában, iskolában, speciális óvodában, iskolában, gyermekotthonban, felnőtt fogyatékosok intézményeiben." },
      { k: "Mit jelent az adaptáció az SNI-s tanuló oktatásában?", v: "A tananyag, módszerek, eszközök és értékelés módosítása a tanuló szükségleteihez – pl. hosszabb feladatmegoldási idő, segédeszközök használata." },
      { k: "Mi az SNI-s gyermek jogai?", v: "Joga van az ingyenes különleges ellátáshoz, speciális szakemberek segítségéhez, az egyéni fejlesztési tervhez és a szükséges segédeszközökhöz." },
      { k: "Milyen segédeszközök segíthetik az SNI-s tanulót?", v: "Halláskészülék, Braille-írógép, kommunikációs tábla, speciális számítógép, különleges íróeszközök, mozgásos segédeszközök." },
      { k: "Mi a gyógypedagógiai asszisztens és a gyógypedagógus kapcsolata?", v: "Az asszisztens a gyógypedagógus irányítása alatt dolgozik. Önállóan nem hozhat szakmai döntéseket – a gyógypedagógus tervez, az asszisztens megvalósítja." },
      { k: "Mi a kompetenciahatár fogalma?", v: "A gyógypedagógiai asszisztens nem lép túl saját hatáskörén: nem diagnosztizál, nem ír fejlesztési tervet, nem dönt szakmai kérdésekben önállóan." },
      { k: "Hogyan kommunikál az asszisztens az SNI-s gyermekkel?", v: "Türelmesen, egyértelműen, rövid mondatokban, sok visszajelzéssel. Az érzelmi biztonság és a bizalom alapvető." },
      { k: "Mit jelent az autizmus barát környezet?", v: "Kiszámítható, strukturált, vizuálisan támogatott, zajszegény, előre jelezhető – csökkenti az autizmus spektrum zavarral élő gyermek szorongását." },
      { k: "Milyen elvek mentén dolgozik a gyógypedagógiai asszisztens?", v: "Empátia, türelem, következetesség, diszkréció, a gyermek méltóságának tisztelete, szakmai alázat és az önálló döntések kerülése." },

    cim: "Pszichológia fogalma, módszerei",
    tetelSzoveg: "Mutassa be a pszichológia fogalmát, tárgyát, feladatát! Helyezze el a pszichológiát a tudományok rendszerében! Ismertesse a pszichológia vizsgálati és kutatási módszereit!",
    teljesLeiras: `A pszichológia a lelki jelenségek, tehát a viselkedés, a gondolkodás, az érzelmek és a motivációk tudományos vizsgálatával foglalkozó diszciplína. Tárgya az emberi pszichikum egésze: a gondolkodás, az érzelem, az akarat, a motiváció, a figyelem, az észlelés, a személyiség és a viselkedés. A pszichológia számos területre tagolódik: van általános pszichológia, fejlődéspszichológia, személyiséglélektan, szociálpszichológia, klinikai pszichológia, neveléspszichológia és gyógypedagógiai pszichológia is.

A pszichológia a tudományok rendszerében a természettudományok, vagyis a biológia és a neurológia, valamint a társadalomtudományok, vagyis a szociológia és a pedagógia határán helyezkedik el, hiszen mindkét területtel szorosan kapcsolódik: a biológiai alapok és a társas-kulturális hatások egyaránt formálják a lelki folyamatokat. A pszichológia négy fő feladata, hogy leírja a lelki jelenségeket, megmagyarázza azokat, megjósolja a viselkedést, és segítsen a változásban, például terápia vagy fejlesztés formájában.

A pszichológia számos kutatási módszert alkalmaz. A megfigyelés során a kutató természetes körülmények között figyeli meg a viselkedést, anélkül hogy beavatkozna, célja a valóságos történések leírása. A kísérlet kontrollált körülmények között vizsgálja az ok-okozati összefüggéseket: változtatnak egy tényezőn, és megfigyelik a hatást. Az interjú személyes kérdezéses módszer, amellyel mélyebb, egyedi információkat gyűjtenek, lehet strukturált vagy kötetlen. A kérdőív előnye, hogy sok emberről gyorsan gyűjthető adat, hátránya viszont, hogy felszínes lehet, és a válaszok szubjektívek. Az esetleírás, vagyis a kazuisztika egyetlen személy részletes vizsgálata, mély megértést ad, de nem általánosítható – Freud klasszikus esetei jó példák erre. A pszichológiai teszt egy standardizált feladatsor, amely egy pszichés jellemzőt mér, például az intelligenciát vagy a szorongást. Az introspekció önmegfigyelés, vagyis a személy saját belső állapotait figyeli meg és írja le, korlátja viszont, hogy könnyen szubjektív és torzulhat. A kutatás lehet longitudinális, amikor ugyanazokat a személyeket éveken át követik nyomon, így a fejlődési folyamatok időbeli alakulása is megfigyelhető, vagy keresztmetszeti, amikor különböző életkorú embereket vizsgálnak egy időpontban – ez gyorsabb, de nem mutatja az egyéni fejlődési utat.

Fontos kiemelni a pszichológiai kutatás etikai szabályait is: a vizsgált személyek beleegyezése szükséges, nem szabad ártani nekik, és az adatokat bizalmasan kell kezelni. A pszichológián belül több irányzat is kialakult: a behaviorista pszichológia, Pavlov, Watson és Skinner nevéhez köthetően, csak a megfigyelhető viselkedéssel foglalkozik, alapja az inger-válasz kapcsolat és a megerősítés. A kognitív pszichológia a gondolkodás, a memória, a figyelem és a problémamegoldás tudományos vizsgálatával foglalkozik, kulcskérdése, hogyan dolgozzuk fel az információt. A humanisztikus pszichológia, Maslow és Rogers nevéhez köthetően, szerint az ember alapvetően jó, és önmegvalósításra törekszik, középpontjában az egyén szabad akarata és méltósága áll.

A pszichológia szorosan kapcsolódik a pedagógiához is: a neveléspszichológia azt vizsgálja, hogyan tanul és fejlődik a gyermek, mi motiválja, és hogyan kezelhetők a nevelési problémák, a gyógypedagógiai pszichológia pedig az akadályozott fejlődésű személyek lelki jellemzőit vizsgálja, ami segít megérteni viselkedésüket és szükségleteiket.`,

  {
    id: 7,
    cim: "Személyiség fogalma, fejlődése",
    tetelSzoveg: "Határozza meg a személyiség fogalmát, valamint a személyiség fejlődését befolyásoló tényezőket! Mutassa be az öröklött tulajdonságok, környezeti hatások személyiségfejlődésben betöltött szerepét!",
    teljesLeiras: `A személyiség az egyén pszichikus sajátosságainak, tulajdonságainak, képességeinek, attitűdjeinek és értékeinek viszonylag állandó, egyedi rendszere, amely meghatározza a gondolkodását, az érzéseit és a viselkedését. A személyiség fejlődését négy fő tényező befolyásolja: az öröklés, vagyis a genetika, a környezet, ide tartozik a família, az iskola és a kultúra, ezek kölcsönhatása, valamint az egyén saját aktivitása is.

Az öröklés és a környezet viszonyát több elmélet is megpróbálta leírni. A biológiai determinizmus szerint kizárólag az öröklés, vagyis a gének döntik el, hogy ki lesz valaki – ide tartoznak például a temperamentum vagy az intelligencia genetikai alapjai. Ezzel szemben a környezeti determinizmus, amelyet a behaviorizmus képvisel, azt állítja, hogy a személyiséget kizárólag a környezet, a tapasztalatok és a nevelés formálja. Galton konvergenciaelmélete szerint az öröklés és a környezet egymástól függetlenül hat a személyiségre, és hatásaik egyszerűen összeadódnak. A modern, interakcionista felfogás szerint azonban az öröklés és a környezet nem egyszerűen összeadódik, hanem kölcsönösen hat egymásra: a gének hatása is függ a környezettől, és fordítva.

Fontos megkülönböztetni a temperamentumot, amely az egyén viszonylag állandó, veleszületett emocionális és reakciómintázata, például mennyire élénk, visszahúzódó vagy ingerlékeny valaki, a karaktertől, amely a személyiség tanult, nevelt összetevője, vagyis az erkölcsi értékek és jellemvonások, amelyek a nevelés és a tapasztalat során alakulnak ki.

A família hatása a legerősebb a korai életszakaszban: az érzelmi kötődés, a nevelési stílus és a családi légkör alapvetően meghatározza az önértékelést, a bizalmat és az értékrendet. Maslow szükséglethierarchiája szerint a személyiség fejlődéséhez biztonságos, kielégített alapszükségletek kellenek, étel, biztonság, szeretet, megbecsülés, és csak ezek megléte esetén érhető el az önmegvalósítás. Az egészséges önértékelés alapja a pozitív élményeknek, a szeretetnek és a reális elvárásoknak; az alacsony önértékelés viszont gátolja a fejlődést.

Az iskola is jelentősen hat a személyiségre: értékeli a teljesítményt, kialakítja a szociális szerepeket és a normarendszert, a pozitív élmény építi, a negatív viszont rombolja az önképet. Az intelligencia genetikai meghatározottsága nagyjából ötven-nyolcvan százalékos, de a környezeti feltételek, mint az iskolázás vagy az ingergazdag környezet, erősen befolyásolják a kibontakozását. Fontos a kritikus periódus fogalma is: a fejlődés során vannak olyan időablakok, amelyekben egy-egy készség vagy tulajdonság különösen könnyen alakul ki, mint például az anyanyelv elsajátítása vagy a kötődés.

Erikson fejlődéselmélete szerint az ember egész életén át fejlődik, és minden életszakaszban egy-egy fejlődési krízissel néz szembe, ezek megoldása vezet egészséges személyiséghez. Freud személyiségstruktúrája szerint az Id, vagyis az ösztönök, az Ego, a reális én, és a Szuperego, az erkölcsi ítéletek hármasának egyensúlyától függ a személyiség. A reziliencia, vagyis a lelki rugalmasság az a képesség, amellyel nehézségek és traumák után is talpra tudunk állni és tovább tudunk fejlődni – ezt az erős kötődés és a pozitív énkép erősen segíti.`,

    teljesLeiras: `Az érés genetikailag programozott, belső fejlődési folyamat: az idegrendszer, az érzékszervek és a motoros rendszer biológiai megérése, amely nem igényel tanulást. A tanulás ezzel szemben pszichológiai értelemben tartós változás a tudásban, a viselkedésben vagy a képességekben, amelyet tapasztalat, gyakorlás vagy megfigyelés okoz. A kettő szorosan összefügg: csak az érés után lehet hatékonyan tanulni egy adott készséget – például az olvasástanítást csak az iskolaérettség elérése után szabad elkezdeni, korábban hiábavaló erőfeszítés volna. A nevelés ugyanakkor nem siettetheti az érést, de a kedvező környezet és a megfelelő nevelés elősegíti az érési folyamatok teljes kibontakozását.

    tetelSzoveg: "Mutassa be a fejlődéslélektan fogalmát, jellemzőit! Határozza meg és értelmezze a kötődés fogalmát és a korai anya-gyermek kapcsolat jelentőségét! Mutassa be a korai anya-gyermek kapcsolatra vonatkozó kísérleteket, megfigyeléseket!",
    teljesLeiras: `A fejlődéslélektan a pszichológia azon ága, amely az ember pszichológiai fejlődését vizsgálja a fogantatástól egészen az öregkorig – az érzelmi, kognitív, szociális és személyiségbeli változásokat. Jellemzően longitudinális szemléletű, vagyis a változásokat és azok törvényszerűségeit vizsgálja, és mindig figyelembe veszi a biológiai és a környezeti tényezők kölcsönhatását.

A kötődés a csecsemő és a gondozója között kialakuló erős, tartós érzelmi kötelék, amely alapul szolgál a biztonságérzethez és a későbbi kapcsolatokhoz. A kötődéselmélet alapjait John Bowlby brit pszichiáter dolgozta ki az ötvenes-hatvanas években, evolúciós megközelítésű elmélet keretében, amely a kötődés biológiai funkcióját vizsgálta. Mary Ainsworth dolgozta ki az úgynevezett Idegen helyzet kísérletet, amelyben azt vizsgálta, hogyan reagál a csecsemő az anya távozásakor és visszatérésekor – anya és gyermek idegennel találkoznak, az anya elmegy, az idegen marad, majd az anya visszatér, és a gyermek reakciói alapján mérhető a kötődési stílus. Így négy kötődési stílust azonosított: a biztonságos kötődést, amikor a gyermek bátran felfedez, mert biztos az anya visszatérésében; az elkerülő kötődést, amikor a gyermek kevéssé reagál; a szorongó-ambivalens kötődést, amikor nagyon fél az anya hiányától; és a dezorganizált kötődést, amelynél nincs egységes stratégia. A biztonságos kötődésnek hosszú távú pozitív hatása van: a felnőtt képes lesz egészséges kapcsolatokat kialakítani, jobban birkózik meg a stresszel, és magasabb az önértékelése.

Két klasszikus megfigyelés is rávilágít a korai kapcsolat jelentőségére. Harlow majomkísérleteiben a kölyök a táplálékot adó drótmama helyett a puha anyagból készült textilmamához ragaszkodott, ami bizonyítja, hogy a kötődés nem csak a táplálkozáson, hanem a testi közelségen alapul. Spitz megfigyelése, az úgynevezett hospitalizáció jelensége szerint az intézetben felnövő, anyai gondoskodástól megfosztott csecsemők súlyos fejlődési visszamaradást, sőt anaklitikus depressziót szenvedhetnek, és súlyos esetben akár meg is halhatnak.

Fontos megemlíteni az apa-gyermek kapcsolat szerepét is: az apa más stílusú kötődést nyújt, több fizikai játékot és kihívást, ami segíti az önállóság fejlődését és az énhatárok kialakulását. A kötődés szempontjából érzékeny időszak az első hat-tizenkét hónap: ha ekkor nem alakul ki stabil kapcsolat, a fejlődés tartósan sérülhet. Erikson elméletében ez az élet első évének fejlődési feladata, a bizalom kontra bizalmatlanság krízise: ha a gondozó megbízható és következetes, kialakul az alapbizalom, amely a kötődés alapja. A korai kötődési minta felnőttkorban is tovább él úgynevezett belső munkamodellként, amely meghatározza, hogyan közelítünk felnőttként a romantikus és baráti kapcsolatokhoz.

A gyógypedagógiai munkában a kötődés kiemelten fontos: a sajátos nevelési igényű gyermeknél is alapvető a következetes, meleg, kiszámítható bánásmód, az asszisztens akár pótló kötődési figurává is válhat intézményi nevelés esetén, hiszen a kötődési nehézség gyakran áll a magatartásproblémák, a tanulási nehézségek és a szociális zavarok hátterében.`,

Az újszülöttkor az első négy hetet öleli fel. Ezt az időszakot az extrauterin élethez való alkalmazkodás jellemzi: a veleszületett reflexek – szopóreflex, Moro-reflex, vagyis ijedési reflex, fogóreflex, lépőreflex, keresőreflex – automatikus, beépített reakciók, az alvás dominál a napban, és az alapvető érzékelés már működik: az újszülött harminc centiméterre élesen lát, hall, érez ízeket és szagokat, és korán preferálja az emberi arcot, ami egy evolúciósan kialakult kötődési mechanizmus.

A csecsemőkor az első életévet jelenti. Jellemzője a gyors testi növekedés – születéskor körülbelül ötven centiméter és három kilogramm, egyéves korra háromszoros súly és kétszeres hossz, az első év a legrohamosabb növekedési periódus. A motoros fejlődés meghatározott sorrendben zajlik: fejemelés egy-két hónapos korban, fordulás három-négy hónaposan, ülés hat hónaposan, mászás nyolc hónaposan, állás tíz hónaposan, önálló járás tizenkettő-tizenöt hónapos korban. Ebben az időszakban alakul ki a kötődés, és megjelennek az első kommunikációs jelzések. Az érzelmi fejlődés is gyors: az alapérzelmek, öröm, félelem, düh korán megjelennek, a szociális mosoly hat hetesen, az idegenektől való félelem hat-nyolc hónaposan, a szeparációs szorongás pedig nyolc-tizenkét hónapos korban jelentkezik. Piaget szerint kilenc hónapos korban alakul ki a tárgyállandóság, vagyis annak megértése, hogy a tárgyak akkor is léteznek, ha nem látjuk őket.

A kisgyermekkor egy-három éves kort jelent. Ekkor jelenik meg az önállóság igénye, tökéletesedik a járás, elsajátítja a gyermek az anyanyelvet, megjelenik a szimbolikus játék, és kialakul az 'én'-tudat. Az anyanyelv-elsajátítás menete: gügyögés, gagyogás, első szavak körülbelül tizenkét hónaposan, szókincsrobbanás tizennyolc-huszonnégy hónaposan, kétszavas mondatok, majd hároméves korra már összefüggő beszéd. A szimbolikus játék körülbelül kétéves kor körül jelenik meg: a gyermek egy tárgyat egy másik tárgy helyett használ, például egy banánt telefonként, ami a szimbolikus gondolkodás kialakulását jelzi. A dackorszak kettő-három éves kor táján jelenik meg, amikor a gyermek saját akaratát fejezi ki – ez nem rossz tulajdonság, hanem az 'én'-tudat megerősödésének egészséges jele.

    cim: "Életkori sajátosságok – óvodáskor, kisiskoláskor, serdülőkor",
    tetelSzoveg: "Jellemezze az életkori sajátosságokat az egyes életkori szakaszokban! Mutassa be az óvodáskor, a kisiskoláskor és a serdülőkor testi, érési, érzelmi és viselkedési jellemzőit!",
    teljesLeiras: `Az óvodáskor három-hat éves kort jelent. Vezető tevékenysége a játék, jellemzi az intenzív mozgásfejlődés, a fantázia virágkora, a szociális kapcsolatok bővülése, a szabálytudat kialakulása és a kíváncsiság. Érzelmei hevesek és gyorsan változók, tipikusak a félelmek, például a sötéttől vagy a szörnyektől való félelem, megjelennek az empátia csírái, és kiemelkedő szerepe van a família érzelmi melegségének.

Az óvodáskor végén alakul ki az iskolaérettség, vagyis az az idegrendszeri, mozgásos, szociális és pszichikus érettségi szint, amely lehetővé teszi az iskolai követelmények teljesítését. Kritériumai közé tartozik a figyelemkoncentráció, az önszabályozás, a szociális érettség, a finommotorika – például a ceruzafogás –, a lelkiismeretes munkaattitűd, valamint az alapvető szókincs és számfogalom.

A kisiskoláskor hat-tíz éves kort ölel fel. Erre Piaget szerint a konkrét műveleti gondolkodás jellemző: a gyermek logikusan gondolkodik, de csak konkrét, szemléletes esetekre, az elvont következtetés még nem megy. Ebben a szakaszban alakul ki a megőrzés, vagyis a konzerváció fogalma: a gyermek megérti, hogy az anyagmennyiség nem változik meg, ha csak az alakja változik – például egy magas, vékony pohár ugyanannyi vizet tartalmaz, mint egy alacsony, széles. Erikson szerint ebben a szakaszban a szorgalom kontra kisebbrendűség krízisét éli meg a gyermek, és egyre nagyobb szerepet kapnak a kortársak.

A serdülőkor tíz-tizennyolc éves kort jelent, és a pubertás, vagyis a nemi érés időszaka. Jellemzői a testi változások – növekedési lökés, a nemi szervek fejlődése, a másodlagos nemi jellegek megjelenése –, az identitáskeresés, a kortárscsoport dominanciája, az érzelmi hullámzás, valamint az absztrakt gondolkodás megjelenése. Lányoknál a pubertás testi jelei a mellnövekedés, a menstruáció és a csípő kiszélesedése, fiúknál a hangmélyülés, a szőrnövekedés és a nemi érés; mindkét nemnél jellemző az akné és a verejtékmirigyek fokozott aktivitása. Erikson szerint a serdülőkor fejlődési krízise az identitáskeresés: 'Ki vagyok én?' – a fiatal különböző szerepeket próbál ki, mielőtt stabil identitást alakít ki. Piaget szerint körülbelül tizenkét éves kortól alakul ki a formális műveleti gondolkodás, amikor a fiatal már elvontan is tud gondolkodni, feltételezéseket tud vizsgálni, és logikailag tud következtetni elméletekre is.

A serdülőkorban a família hatása csökken, a kortárscsoport veszi át a fő szocializációs szerepet, ami azonos értékeket, megértést és identitástámaszt ad, de nyomást is jelenthet. Jellemző az érzelmi labilitás, vagyis a gyors hangulatingadozás a hormonális változások miatt, valamint egy újfajta egocentrizmus: az imaginárius közönség élménye, vagyis hogy 'mindenki rám figyel', és a személyes fábula, vagyis hogy 'velem ez nem történhet meg'. Kohlberg szerint a serdülők erkölcsi fejlődésükben a posztkonvencionális szint felé mozdulnak, elveket, igazságot és elvont erkölcsi értékeket kezdenek mérlegelni. A rizikómagatartás, vagyis a veszélyes szituációk keresése az idegrendszer még éretlen impulzusszabályozása és az autonómiavágy együttes következménye, a lázadás pedig az önállóság kivívásának szükségszerű, normális fejlődési eszköze, amelyhez azonban következetes határok kellenek. A pedagógus legjobb eszközei ebben az életszakaszban a tiszteletteljes, dialogikus kapcsolat, a határok következetes tartása, az autonómia fokozatos biztosítása és az empátia a hangulatingadozások idején.`,
    kartya: [
      { k: "Mi jellemzi az óvodáskort (3-6 év)?", v: "Vezető tevékenység a játék. Intenzív mozgásfejlődés, fantázia virágkora, szociális kapcsolatok bővülése, szabálytudat kialakulása, kíváncsiság." },
      { k: "Mi az iskolaérettség?", v: "Az idegrendszeri, mozgásos, szociális és pszichikus érettség szintje, amely lehetővé teszi az iskolai követelmények teljesítését. Feltétele a sikeres iskolakezdésnek." },
      { k: "Mik az iskolaérettség kritériumai?", v: "Figyelemkoncentráció, önszabályozás, szociális érettség, fine motorika (ceruza), lelkiismeretes munkaattitűd, alap szókincs és számfogalom." },
      { k: "Mi jellemzi a kisiskoláskor (6-10 év)?", v: "Konkrét műveleti gondolkodás (Piaget), logikus következtetés konkrét tárgyakra, szorgalom vs. kisebbrendűség krízis (Erikson), kortársak fontossága nő." },
      { k: "Mi a konkrét műveleti gondolkodás?", v: "Piaget szerint 7-11 éves korban a gyerek logikusan gondolkodik, de csak konkrét, szemléletes esetekre – elvont következtetés még nem megy." },
      { k: "Mi a megőrzés fogalma Piaget-nél?", v: "A gyerek megtanulja, hogy az anyagmennyiség nem változik meg, ha az alakja változik (pl. hosszú vékony pohár ugyanannyi vizet tartalmaz, mint az alacsony széles)." },
      { k: "Mi jellemzi a serdülőkort (10-18 év)?", v: "Pubertás (nemi érés), identitáskeresés, kortárscsoport dominanciája, érzelmi hullámzás, absztrakt gondolkodás megjelenése, önállóság igénye." },
      { k: "Mi a pubertás?", v: "A nemi érés folyamata – testi változások (növekedési spurt, nemi szervek fejlődése, másodlagos nemi jellegek megjelenése) serdülőkorban." },
      { k: "Mi az identitáskeresés Erikson szerint?", v: "A serdülőkor fejlődési krízise: 'Ki vagyok én?' A fiatal különböző szerepeket próbál ki, mielőtt stabil identitást alakít ki." },
      { k: "Mi a formális műveleti gondolkodás?", v: "Piaget szerint kb. 12 éves kortól a gyerek elvontan is tud gondolkodni – feltételezéseket vizsgál, logikailag következtet elméletekre." },
      { k: "Milyen testi változások jellemzik a serdülőkort?", v: "Lányoknál: mellnövekedés, menstruáció, csípő kiszélesedés. Fiúknál: hangmélyülés, szőrnövekedés, pénisz fejlődése, spermatozoid termelés. Mindkettőnél: akné, verejtékmirigy aktiválódás." },
      { k: "Miért fontos a kortárscsoport serdülőkorban?", v: "A familia hatása csökken, a kortárscsoport veszi át a fő szocializációs szerepet. Azonos értékek, megértés, identitástámasz – de nyomást is jelent." },
      { k: "Mi az érzelmi labilitás a serdülőkorban?", v: "Gyors hangulatingadozások hormonális változások miatt – pillanatokkal ezelőtt vidám volt, most sír. Ez normális, de következetes határok szükségesek." },
      { k: "Mi az egocentrizmus serdülőkorban?", v: "Imaginárius közönség: 'Mindenki rám figyel.' Személyes fábula: 'Velem ez nem történhet meg.' Újfajta egocentrizmus, de más, mint kisgyermekkorban." },
      { k: "Hogyan változik az erkölcsi fejlődés serdülőkorban?", v: "Kohlberg szerint a serdülők a posztkonvencionális szint felé mozdulnak – elveket, igazságot, elvont erkölcsi értékeket kezdenek mérlegelni." },
      { k: "Mi a rizikomagatartás és miért jellemző serdülőkorban?", v: "Kísérletezés tiltott anyagokkal, veszélyes szituációk keresése – az idegrendszer éretlen impulzusszabályozása és az autonómiavágy együttesen okozzák." },
      { k: "Mi a lázadás szerepe serdülőkorban?", v: "Az önállóság kivívásának szükségszerű eszköze. Nem patológia, hanem fejlődési igény – de határok és következetesség szükségesek." },
      { k: "Hogyan segíthet a pedagógus serdülőkorban?", v: "Tiszteletteljes, dialogikus kapcsolat, határok következetes tartása, autonómia fokozatos biztosítása, empátia a hangulatingadozások során." },
      { k: "Mi az iskolai teljesítmény és serdülőkor kapcsolata?", v: "Teljesítmény ingadozhat az érzelmi viharok miatt. Belső motiváció fenntartása, reális elvárások és pozitív visszajelzés kulcsfontosságú." },
      { k: "Mi jellemzi az óvodás gyermek érzelmi fejlődését?", v: "Érzelmek hevesek, gyorsan változók. Félelemek tipikusak (sötét, szörnyek). Empátia csírái megjelennek. A familia érzelmi melegségének kiemelkedő szerepe." },
    ],
    fogalmak: [
      { f: "Óvodáskor", m: "3-6 éves kor. A gyerek főként játékkal tanul – ez a vezető tevékenysége. Fantáziája virágzik, és megtanulja az alapvető szociális szabályokat." },
      { f: "Iskolaérettség", m: "Az a fejlettségi szint, amikor egy gyerek készen áll az iskolára – tud figyelni, önállóan dolgozni, és szociálisan is érett." },
      { f: "Kisiskoláskor", m: "6-10 éves kor. A gyerek logikusan gondolkodik, de csak konkrét dolgokon. Fontos lesz neki, hogy jó legyen valamiben – ez adja az önbizalmát." },
      { f: "Serdülőkor", m: "10-18 éves kor. A pubertás és az identitáskeresés időszaka. 'Ki vagyok én?' – ez a fő kérdés. Testük megváltozik, a kortársak fontossá válnak." },
      { f: "Pubertás", m: "A nemi érés folyamata – testi változások jelzik, hogy a gyerekből felnőtt lesz. Hormonok, fizikai változások, és velük együtt hangulatingadozások." },
      { f: "Identitáskeresés", m: "Serdülőkorban megkérdőjelezünk mindent: ki vagyok, miben hiszek, mi akarok lenni? Ez normális – a felnőtt identitás csak fokozatosan alakul ki." },
      { f: "Formális műveleti gondolkodás", m: "Kb. 12 évtől elvontan is tudunk gondolkodni – nem csak konkrét tárgyakra, hanem elméletekre, feltételezésekre is." },

  {
    id: 12,
    cim: "Megismerő funkciók fejlődése",
    tetelSzoveg: "Mutassa be a megismerő funkciók (érzékelés, észlelés, figyelem, emlékezet, képzelet, gondolkodás) fejlődésének sajátosságait újszülöttkortól kisiskoláskorig!",
    teljesLeiras: `A megismerő funkciók közé tartozik az érzékelés, az észlelés, a figyelem, az emlékezet, a képzelet és a gondolkodás – ezek teszik lehetővé, hogy a külső világ információit feldolgozzuk. Az érzékelés az inger hatása az érzékszervekre, például a fény a szemre, az észlelés pedig az érzékletek értelmezése, értelmessé tétele az agyban, vagyis amikor felismerjük, hogy amit látunk, az egy alma.

Az érzékelés újszülöttkorban is már jól fejlett: a látás harminc centiméterre éles, és az újszülött preferálja az emberi arcot, a hallása fejlett és hangra reagál, a tapintása, íz- és szagérzékelése szintén fejlett, bár felnőtt szinttől még elmarad. A figyelem fejlődése jól nyomon követhető: újszülöttnél involuntáris, vagyis reflexszerű, csecsemőnél szelektívvé válik – az arcot és a mozgást figyeli –, kisgyermeknél rövid, de már szándékos, óvodásnál tíz-tizenöt percig tart, kisiskolásnál pedig már húsz-harminc percig. Az önkéntelen figyelmet egy erős, új vagy érdekes inger vonja magára automatikusan – ez az alapvető figyelemforma csecsemőkorban –, míg a szándékos figyelem tudatos, irányított, és körülbelül hároméves kortól fejlődik ki, iskoláskorban válik meghatározóvá.

Az emlékezet fejlődése szintén fokozatos: csecsemőnél rövid felismerési emlékezet van, kisgyermeknél megjelenik az epizodikus emlékezet, vagyis az élmények emlékezete, óvodásnál kialakul a szándékos memorizálás, kisiskolásnál pedig már tanulási stratégiák is megjelennek. Megkülönböztetjük a deklaratív emlékezetet, vagyis a tények és élmények tudását, a procedurális emlékezettől, amely a cselekvések automatizált emlékezete, mint a kerékpározás. Az infantilis amnézia jelensége miatt nem emlékezünk csecsemőkorunkra: a hippocampus, vagyis az emlékezeti agyterület még nem érett az életesemények tárolásához három-négy éves kor előtt.

A képzelet kétéves kortól jelenik meg a szimbolikus játékban, óvodáskorban éli virágkorát, amikor a fantázia és a valóság gyakran keveredik, kisiskoláskorra pedig realisztikusabbá válik. A gondolkodás fejlődését Piaget négy szakaszra osztotta: a szenzomotoros szakasz nulla-kétéves korban, amikor a gyermek cselekvéssel és érzékeléssel ismeri meg a világot, szimbolikus gondolkodás nélkül; a preoperatív szakasz két-hétéves korban; a konkrét műveleti szakasz hét-tizenegy éves korban, amikor megjelenik a konzerváció, vagyis annak megértése, hogy az anyag mennyisége nem változik az alak megváltozásával; és tizenkét éves kortól a formális műveleti szakasz.

A munkamemória, vagyis a rövid távú memória korlátozott kapacitású – nagyjából hét elemet képes tárolni körülbelül húsz másodpercig –, ami az iskolai tanulási nehézségek egyik fontos tényezője. Az emlékezet fejlesztésének eszközei az ismétlés, a csoportosítás, vagyis a chunking, az asszociációk, a mnemotechnikák, az értelmes, összefüggésekre épülő tanulás és a mozgásos bevésés. A gondolkodás fejlesztésének iskoláskori eszközei a problémamegoldó feladatok, a kísérletezés, a vita, a projektmunka, az analógiák keresése és az ok-okozati összefüggések feltárása.

Sajátos nevelési igényű gyermekeknél a figyelem fejlesztését rövid feladatokkal, sok váltással, érzékletes anyagokkal, strukturált környezettel, jutalmazással és vizuális segédeszközökkel segíthetjük. Az érzékszervi stimuláció csecsemőkorban kiemelten fontos, hiszen az érzékleti ingerek serkentik az idegrendszer fejlődését – ingerszegény környezetben, vagyis depriváció esetén a megismerő funkciók fejlődése visszamaradhat.`,
    kartya: [
      { k: "Melyek a megismerő funkciók?", v: "Érzékelés, észlelés, figyelem, emlékezet, képzelet, gondolkodás – ezek teszik lehetővé, hogy a külső világ információit feldolgozzuk." },
      { k: "Mi az érzékelés és az észlelés különbsége?", v: "Érzékelés: az inger hatása az érzékszervekre (pl. fény a szemre). Észlelés: az érzékletek értelmezése, értelmessé tétele az agyban (pl. ez egy alma)." },
      { k: "Hogyan fejlődik az érzékelés újszülöttkorban?", v: "Látás: 30 cm-re éles, arcot preferál. Hallás: fejlett, hangtól reagál. Tapintás, íz, szag: fejlett. Az összes érzékszerv működik, de felnőtt szinttől elmarad." },
      { k: "Hogyan fejlődik a figyelem?", v: "Újszülöttnél involuntáris (reflex-szerű). Csecsemőnél szelektív (arcot, mozgást figyel). Kisgyermeknél rövid, de szándékos. Óvodásnál 10-15 perc. Kisiskolásnál 20-30 perc." },
      { k: "Mi az önkéntelen figyelem?", v: "Automatikus, szándéktalan figyelem – valami erős, új, érdekes inger vonja magára (pl. hangos zaj). Ez az alapvető figyelemforma csecsemőkorban." },
      { k: "Mi a szándékos figyelem?", v: "Tudatos, irányított figyelem, amelyet akaratlagosan tartunk fenn egy feladaton. Kb. 3 évtől fejlődik ki, és iskoláskorban válik meghatározóvá." },
      { k: "Hogyan fejlődik az emlékezet?", v: "Csecsemőnél rövid felismerési emlékezet. Kisgyermeknél epizodikus emlékezet (élmények). Óvodásnál szándékos memorizálás megjelenik. Kisiskolásnál stratégiák alakulnak." },
      { k: "Mi a deklaratív és procedurális emlékezet?", v: "Deklaratív: tények és élmények emlékezete ('tudás'). Procedurális: cselekvések automatizált emlékezete ('hogyan csinálom') – pl. kerékpározás." },
      { k: "Hogyan fejlődik a képzelet?", v: "2 évtől szimbolikus játékban jelenik meg. Óvodásnál virágjában van – fantázia és valóság keveredik. Kisiskolásnál realisztikusabb lesz." },
      { k: "Hogyan fejlődik a gondolkodás Piaget szerint?", v: "Szenzomotoros (0-2) → Preoperatív (2-7) → Konkrét műveleti (7-11) → Formális műveleti (12+) – egymásra épülő szakaszok." },
      { k: "Mi a szenzomotoros gondolkodás?", v: "0-2 éves kor. A gyerek cselekvéssel, érzékeléssel ismeri meg a világot. Nincs szimbolikus gondolkodás – ami kézben van, az valóságos." },
      { k: "Mi a konzerváció fogalma?", v: "Piaget fogalma: kb. 7 éves kortól érti meg a gyerek, hogy az anyag mennyisége nem változik az alak megváltozásával (pl. gömbölyű agyag → hosszú agyag = ugyanannyi)." },
      { k: "Hogyan fejlődik a figyelem az óvodáskorban?", v: "Az óvodás kb. 10-15 percig képes koncentrálni. Mozgásos, játékos, változatos feladatoknál hosszabb a figyelemtartama." },
      { k: "Mi a veleszületett emlékezet?", v: "Az újszülöttnek nincs élményre épülő emlékezete, de veleszületett preferenciái vannak – pl. az anya hangját felismeri, mert méhen belül hallotta." },
      { k: "Miért nem emlékeznek az emberek csecsemőkorukra?", v: "Infantilis amnézia: a hippocampus (emlékezeti régió) még nem érett az életesemények tárolásához – ezért nem maradnak epizodikus emlékek 3-4 éves kor előttről." },
      { k: "Hogyan fejleszthetjük a figyelmet SNI-s gyerekeknél?", v: "Rövid feladatok, sok váltás, érzékletes anyagok, strukturált környezet, jutalom az erőfeszítésért, vizuális kiegészítők alkalmazása." },
      { k: "Mi a munkamemória (rövid távú memória)?", v: "Rövid ideig tárol aktív információt (kb. 7 elem, 20 másodpercig). Korlátolt kapacitású – az iskola tanulási nehézségeinek fontos faktora." },
      { k: "Hogyan fejleszthető az emlékezet?", v: "Ismétlés, csoportosítás (chunking), asszociációk, mnemotechnikák, értelmes tanulás (összefüggések), mozgásos bevésés." },
      { k: "Mi a gondolkodás fejlesztésének módja iskoláskorban?", v: "Problémamegoldó feladatok, kísérletezés, vita, projekt, analógiák keresése, ok-okozati összefüggések keresése, nyílt végű kérdések." },
      { k: "Miért fontos az érzékszervi stimuláció csecsemőkorban?", v: "Az érzékleti ingerek serkentik az idegrendszer fejlődését – szegény ingerkörnyezetben (depriváció) a megismerő funkciók fejlődése visszamarad." },
    ],
    fogalmak: [
      { f: "Érzékelés", m: "Amikor az érzékszerveink (szem, fül, bőr) befogadják a külső világ jelzéseit. Pl. a szemed érzékeli a fényt." },
      { f: "Észlelés", m: "Az érzékelt ingereket az agyunk értelmezi és felismeri. Pl. a szemed látja a fényt – az agyad felismeri, hogy ez egy alma." },
      { f: "Figyelem", m: "Az a képesség, hogy az összes inger közül csak egyre koncentrálunk. Pl. tanóra alatt csak a tanárra figyelünk (kellene)." },
      { f: "Emlékezet", m: "Ami megtörtént, azt elraktározzuk és elő tudjuk hívni. Többféle van: rövid távú (munkamemória) és hosszú távú emlékezet." },

  {
    id: 13,
    cim: "Szociálpszichológia alapfogalmai",
    tetelSzoveg: "Ismertesse a szociálpszichológia fogalmát, tárgyát és mutassa be a szociálpszichológia alapfogalmait: csoport, szerep, státusz, előítélet, deviancia",
    teljesLeiras: `A szociálpszichológia azt vizsgálja, hogyan befolyásolja mások jelenléte, véleménye és viselkedése az egyén gondolkodását, érzelmeit és cselekedeteit. A csoport két vagy több személy, akik között tartós interakció, közös cél, közös normák és csoportidentitás alakult ki. Megkülönböztetünk elsődleges csoportokat, mint a família vagy a baráti kör, amelyek személyesek és meghittek, és másodlagos csoportokat, mint az iskola vagy a munkahely, amelyek formálisabbak és funkcionálisabbak.

A csoportszerep a csoport által elvárt viselkedésmód, amelyet a csoporttagoknak be kell tölteniük, például vezető, mediátor vagy szorgalmas tag. A státusz az egyén rangsora, tekintélye, elismertsége a csoporton belül, amely meghatározza, mennyire hallgatnak rá, mekkora a befolyása. A szerep és a státusz szorosan összefügg: a magas státuszú személytől elvárják a vezető szerepet, de a szerep betöltése is emelheti a státuszt – egymást erősítik.

Az előítélet negatív érzelmi és kognitív beállítódás valakivel szemben, anélkül hogy valódi személyes tapasztalatunk lenne róla, jellemzően egy csoporthoz tartozása alapján. Az előítélet kialakulhat sztereotípiákból, az idegen csoporttal szembeni félelemből, ismerethiányból vagy a szocializáció során átvett negatív véleményekből. A sztereotípia leegyszerűsített, általánosított kép egy csoportról, amely nem veszi figyelembe az egyéni különbségeket. A sztereotípia inkább kognitív, gondolkodásbeli általánosítás, az előítélet ezzel szemben érzelmileg negatív, és cselekvésre hajlamosít, ami diszkriminációhoz vezethet – ez utóbbi az előítéleten alapuló hátrányos megkülönböztetés a cselekvésben, például amikor valakit emiatt nem vesznek fel munkára.

A deviancia az adott társadalmi normáktól való eltérést jelenti – olyan eltérő viselkedést, amely megsérti a közmegállapodott szabályokat. Megkülönböztetünk pozitív devianciát, mint egy zseni vagy egy forradalmár, és negatív devianciát, mint a bűnözés vagy az önkárosítás – mindkettő a normáktól való eltérés, csak más-más előjellel.

Fontos fogalom a csoportkohézió, vagyis az az összetartó erő, amely a csoportot egységben tartja: erős kohézió hatékony együttműködéshez vezet, de magában hordozza a csoportnyomás veszélyét is. A konformitás az a jelenség, amikor alkalmazkodunk a csoportnormákhoz, akár saját véleményünk ellenére is – Asch klasszikus kísérletében a résztvevők nyilvánvalóan helytelen válaszokat is adtak, csak hogy beleolvadjanak a csoportba. A szociális facilitáció azt jelenti, hogy mások jelenléte javítja a jól ismert, automatikus feladatok teljesítményét, de rontja az újszerű, nehéz feladatokét. A bystander-effektus pedig azt a jelenséget írja le, hogy minél többen vannak jelen egy segítséget igénylő helyzetben, annál kevésbé avatkoznak be, mert mindenki azt gondolja, majd a másik megteszi.

Az iskolai gyakorlatban az előítéletek csökkentésének leghatékonyabb eszközei a személyes kontaktus az előítélet tárgyával, a pozitív visszajelzések, az inkluzív szemlélet, a pedagógus saját modellezése és a kooperatív feladatok alkalmazása.`,
    kartya: [

      { k: "Milyen típusú csoportok léteznek?", v: "Elsődleges (familia, barátok – személyes, meghitt) és másodlagos (iskola, munkahely – formálisabb, funkcionális) csoportok." },

      { k: "Mi a státusz?", v: "Az egyén rangsora, tekintélye, elismertsége a csoporton belül – meghatározza, mennyire hallgatnak rá, mekkora befolyása van." },

      { k: "Hogyan keletkezik az előítélet?", v: "Sztereotípiákból, az idegencsoporttal (outgroup) szembeni félelemből, ismerethiányból, szocializáció útján átvett negatív véleményekből." },
      { k: "Mi a sztereotípia?", v: "Leegyszerűsített, általánosított kép egy csoportról – nem veszi figyelembe az egyéni különbségeket (pl. 'minden X csoport tagja Y')." },
      { k: "Hogyan különbözik a sztereotípia az előítélettől?", v: "A sztereotípia kognitív (gondolkodásbeli) általánosítás. Az előítélet érzelmileg negatív és cselekvésre hajlamosít – diszkriminációhoz vezet." },
      { k: "Mi a diszkrimináció?", v: "Az előítéleten alapuló hátrányos megkülönböztetés cselekvésben – pl. nem veszik fel munkára, nem fogadják be az iskolai közösségbe." },

      { k: "Milyen típusú deviancia létezik?", v: "Pozitív deviancia (pl. zseni, forradalmár), negatív deviancia (bűnözés, önkárosítás). Mindkettő normáktól való eltérés." },
      { k: "Mi a csoportkohézió?", v: "Az összetartó erő, amely a csoportot egységben tartja. Erős kohézió → hatékony együttműködés, de csoportnyomás veszélyével." },
      { k: "Mi a konformitás?", v: "Alkalmazkodás a csoportnormákhoz – akár saját véleményünk ellenére. Asch kísérlete: a résztvevők nyilvánvalóan helytelen válaszokat adtak, csak hogy beleolvadjanak." },
      { k: "Mi a csoportnyomás?", v: "A csoport elvárásai olyan erősen hatnak, hogy az egyén megváltoztatja viselkedését, véleményét a csoporthoz való tartozás érdekében." },
      { k: "Mi a szociális facilitáció?", v: "Mások jelenléte javítja a jól ismert, automatikus feladatok teljesítményét – de rontja az újszerű, nehéz feladatokét." },

      { k: "Hogyan csökkenthetjük az előítéleteket az iskolában?", v: "Személyes kontaktus az előítélet tárgyával, pozitív visszajelzések, inklúzív szemlélet, pedagógus modellezése, kooperatív feladatok." },
      { k: "Mi a referenciakeret fogalma?", v: "Azok az értékek, normák és tapasztalatok, amelyek alapján megítélünk helyzeteket. Más referenciakeretből ugyanaz a helyzet másképp látszik." },

      { f: "Csoport", m: "Emberek, akik rendszeresen találkoznak, közös céljuk van és szabályaik. Pl. osztály, familia, sportcsapat." },

  {
    id: 14,
    cim: "Nevelési stílusok, nevelői attitűd",
    tetelSzoveg: "Mutassa be a nevelési – vezetési stílusokat, valamint a nevelői attitűd formáit! Ismertesse a gyermekek, tanulók közötti kapcsolatok feltérképezésének lehetőségét!",
    teljesLeiras: `A nevelési stílus a nevelő azon jellemző, viszonylag tartós magatartásformáinak összessége, amelyeket a nevelt irányában alkalmaz – tehát a szeretet, a kontroll és a kommunikáció mintázata. Három alapvető nevelési stílust különböztetünk meg. A tekintélyelvű, vagyis autoritárius nevelőre magas kontroll és alacsony melegség jellemző, jelmondata: 'Ezt mondom, ezt teszed.' Következménye az engedelmesség, de az alacsony önbizalom és a kreativitás gátlása is. Az engedékeny, permisszív nevelőnél alacsony a kontroll, de magas a melegség, jelmondata: 'Mindent szabad.' Következménye, hogy a gyerek nem ismeri a határokat, és alacsony a frusztrációtűrése. A megkívánó, autoritatív vagy demokratikus nevelőnél magas a kontroll és magas a melegség egyszerre: következetes határokat tart, de mindig magyaráz és szeretetet is ad – a kutatások szerint ez vezet a legjobb fejlődési eredményekhez.

A nevelői attitűd a nevelő érzelmi beállítódása, viszonyulása a neveltek felé: lehet elfogadó, elutasító, közömbös vagy túlvédő. Az elfogadó-demokratikus attitűd, az elutasító-autoriter, a közömbös-elhanyagoló és a túlvédő-engedékeny attitűd az emocionális klíma és a kontroll tengelyén különböznek egymástól. Az elutasító nevelői attitűd súlyos következményekkel jár: a gyermek nem érzi magát szeretve, ami alacsony önértékeléshez, magatartásproblémákhoz, szorongáshoz és az agresszió kialakulásának fokozott kockázatához vezethet. Fontos fogalom a kettős kötés is, amikor egymásnak ellentmondó üzeneteket kap a gyermek – például szóban 'szeretlek' hangzik el, miközben a testbeszéd elutasítást mutat –, ekkor a gyermek nem tudja, melyiket higgye, ami pszichésen káros hatású.

A gyermekek és tanulók közötti kapcsolatok feltérképezésének klasszikus eszköze a szociometria, amelyet Moreno dolgozott ki: ezzel a csoporton belüli kapcsolatokat mérik, vagyis hogy ki kihez vonzódik, és kit utasít el, kérdőív és szociogram segítségével. A szociogram a szociometriai felmérés grafikus ábrázolása, ahol a nyilak mutatják az elfogadást és az elutasítást – ez segít azonosítani a vezéreket, a peremhelyzetűeket és a magányos tanulókat. A csillag típusú tanuló sok pozitív szavazatot kap, ő a csoport informális vezetője; a peremhelyzetű tanulónak kevés kapcsolata van, sem nem kifejezetten kedvelt, sem nem elutasított; az elutasított, izolált tanulót pedig sok negatív szavazat éri, akit aktívan kerülnek vagy elutasítanak – ő fokozott pedagógiai figyelmet igényel.

A csoportklíma feltérképezése azért fontos, mert ha ismerjük a csoport dinamikáját, célzottan tudjuk segíteni a kirekesztett tanulókat, és megelőzhetjük a bullyingot. Fontos megkülönböztetni a bullyingot a konfliktustól: a bullying szándékos, ismétlődő ártás hatalmi egyenlőtlenség mellett, míg a konfliktus egyszeri, és az erőviszonyok egyenlők – bullying esetén azonnali pedagógiai beavatkozás szükséges. Sajátos nevelési igényű gyermeknél a nevelési stílus hatása felerősödik: számára különösen fontos a kiszámítható, következetes, elfogadó és türelmes nevelői attitűd, amely megadja a fejlődéshez szükséges érzelmi biztonságot.`,

      { k: "Mi a tekintélyelvű (autoritárius) nevelő jellemzője?", v: "Magas kontroll, alacsony melegség. 'Ezt mondom, ezt teszed.' Következménye: engedelmesség, alacsony önbizalom, kreativitás gátlása." },

      { k: "Miért fontos a csoportklíma feltérképezése?", v: "Ha ismerjük a csoport dinamikáját, célzottan tudjuk segíteni a kirekesztett tanulókat és megelőzni a bullying-ot." },
      { k: "Mi a bullying és hogyan különböztethető meg a konfliktustól?", v: "Bullying: szándékos, ismétlődő ártás hatalmi egyenlőtlenség esetén. Konfliktus: egyszeri, erőviszonyok egyenlők. Bullying esetén azonnali beavatkozás szükséges." },
      { k: "Hogyan befolyásolja a nevelési stílus az SNI-s gyermek fejlődését?", v: "Az SNI-s gyermeknek különösen fontos a kiszámítható, következetes, elfogadó és türelmes nevelői attitűd – ez adja az érzelmi biztonságot a fejlődéshez." },
